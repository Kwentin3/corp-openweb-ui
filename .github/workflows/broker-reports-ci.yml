name: Broker Reports CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: broker-reports-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  broker-reports-ci:
    name: broker-reports-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: services/broker-reports-gate1-proof
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checked-out commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check pull request diff
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/broker-reports-gate1-proof/requirements-ci.txt

      - name: Install Broker Reports CI dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Check generated managed assets
        run: |
          python scripts/build_openwebui_managed_financial_assets.py --check
          python scripts/build_gate2_financial_semantic_model_assets.py --check
          python scripts/build_gate2_financial_semantic_v5_execution.py --check
          python scripts/build_context_v2_1_three_provider_local_proof.py --check
          python scripts/build_context_v2_1_budget_smoke_plan.py --check
          python scripts/build_context_v2_1_comparative_evidence_pack.py --check
          python scripts/build_type_first_semantic_decision_architecture_audit.py --check
          python scripts/build_type_first_fail_closed_contract.py --check
          python scripts/build_kt2_same_source_type_first_corpus.py --check
          python scripts/build_kt2_same_source_type_first_proof.py --check

      - name: Check generated Function bundles
        run: |
          python scripts/build_openwebui_pipe_bundle.py --target all
          git diff --exit-code -- \
            openwebui_actions/broker_reports_gate1_pipe_bundled.py \
            openwebui_actions/broker_reports_gate2_source_fact_pipe_bundled.py \
            openwebui_actions/broker_reports_gate2_domain_source_fact_pipe_bundled.py

      - name: Run baseline-compatible Ruff correctness checks
        run: python -m ruff check --no-cache --select E9,F63,F7,F82 .

      - name: Run current Context V2.1 anti-drift tests
        run: |
          python -m pytest -q \
            tests/test_broker_reports_gate2_financial_semantic_context_v2_1.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_1_choice.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_linter.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_1_linter.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_1_provider_proof.py \
            tests/test_broker_reports_gate2_context_v2_1_budget_smoke_client.py \
            tests/test_broker_reports_gate2_context_v2_1_budget_smoke_direct_transport.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_1_budget_smoke_plan.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_1_budget_smoke_evidence.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_1_budget_smoke_report.py \
            tests/test_live_gate2_financial_semantic_v6_context_v2_1_three_provider_smoke.py \
            tests/test_build_context_v2_1_budget_smoke_plan.py \
            tests/test_build_context_v2_1_comparative_evidence_pack.py \
            tests/test_build_type_first_semantic_decision_architecture_audit.py \
            tests/test_build_type_first_fail_closed_contract.py \
            tests/test_broker_reports_gate2_model_clients.py \
            tests/test_broker_reports_gate2_provider_execution.py \
            tests/test_broker_reports_gate2_economy_budget.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_evidence.py \
            --tb=short
          python -m pytest -q \
            tests/test_broker_reports_gate_architecture.py \
            tests/test_broker_reports_gate2_financial_semantic_v6_packet.py \
            -k context_v2_1 \
            --tb=short

      - name: Run focused Broker Reports tests
        run: >-
          python -m pytest -q
          tests/test_broker_reports_gate_architecture.py
          tests/test_broker_reports_kt1_architecture_stabilization.py
          tests/test_broker_reports_pdf_view_semantic_experiment.py
          tests/test_broker_reports_managed_document_contract.py
          tests/test_broker_reports_managed_document_llm_view.py
          tests/test_broker_reports_managed_document_contract_v2.py
          tests/test_broker_reports_logical_row_table_recovery.py
          tests/test_broker_reports_managed_pdf_document_v2.py
          tests/test_broker_reports_managed_document_llm_view_v2.py
          tests/test_broker_reports_doc6_safe_evidence.py
          tests/test_broker_reports_kt16_canonical_context.py
          tests/test_broker_reports_kt2_same_source_type_first_proof.py
          tests/test_broker_reports_gate1_pipe_bundle.py
          tests/test_broker_reports_gate2_pipe_bundle.py
          tests/test_broker_reports_managed_decision_reason_catalog.py
          tests/test_broker_reports_gate2_outcome_taxonomy_catalog_v2.py
          tests/test_broker_reports_gate2_minimal_managed_projection.py
          tests/test_broker_reports_gate2_financial_semantic_v6_outcome_audit.py
          tests/test_broker_reports_financial_semantic_pack.py
          tests/test_broker_reports_openwebui_managed_asset_family.py
          tests/test_broker_reports_gate2_financial_semantic_v6_packet.py
          tests/test_broker_reports_gate2_financial_semantic_context_v2_1.py
          tests/test_broker_reports_gate2_financial_semantic_v6_choice.py
          tests/test_broker_reports_gate2_financial_semantic_v6_local_choice.py
          tests/test_broker_reports_gate2_financial_semantic_v6_context_v2_hierarchy.py
          tests/test_broker_reports_gate2_financial_semantic_v6_totality.py
          tests/test_repository_privacy_guard.py
          --tb=short

      - name: Run Gate 2 canonical architecture guards
        run: >-
          python -m pytest -q
          tests/test_broker_reports_doc34_repository_contract.py
          tests/test_broker_reports_canonical_artifact_v1.py
          tests/test_broker_reports_canonical_multiformat.py
          tests/test_broker_reports_canonical_pipeline_contract.py
          tests/test_broker_reports_gate3_minimal_labeling_contract.py
          tests/test_broker_reports_gate3_projection.py
          tests/test_broker_reports_gate3_structural_chunking.py
          tests/test_broker_reports_gate3_financial_label_dictionary.py
          tests/test_broker_reports_gate3_financial_role_pack.py
          tests/test_broker_reports_gate3_bounded_labeling.py
          tests/test_broker_reports_gate3_role_labeling.py
          tests/test_broker_reports_gate3_chunk_batch_labeling.py
          tests/test_broker_reports_gate3_financial_annotations_persistence.py
          tests/test_broker_reports_gate3_ndfl_case_readiness.py
          tests/test_broker_reports_gate3_ndfl_workflow.py
          tests/test_broker_reports_gate3_openwebui_managed_dictionary.py
          tests/test_live_gate3_strict_alias_closeout.py
          tests/test_broker_reports_canonical_storage_lifecycle_v1.py
          tests/test_broker_reports_canonical_consumer_compatibility.py
          tests/test_broker_reports_canonical_consumer_pipeline.py
          tests/test_broker_reports_xlsx_canonical_streaming.py
          tests/test_broker_reports_pdf_canonical_roundtrip.py
          tests/test_broker_reports_canonical_machine_projection.py
          tests/test_broker_reports_pdf_canonical_table_crop.py
          --tb=short
