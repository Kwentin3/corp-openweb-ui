name: Portal help contracts

on:
  pull_request:
    paths:
      - 'deploy/openwebui-knowledge/portal-help/**'
      - 'deploy/openwebui-skills/portal-help*'
      - 'scripts/sync-portal-help.py'
      - 'scripts/tests/test_sync_portal_help.py'
      - '.github/workflows/portal-help.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portal-help-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Check native sync publication contracts
        run: python -m unittest discover -s scripts/tests -p test_sync_portal_help.py -v
      - name: Validate the nonempty UTF-8 corpus and managed Skill
        run: |
          python scripts/sync-portal-help.py --help
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path = Path('scripts/sync-portal-help.py')
          spec = importlib.util.spec_from_file_location('portal_help', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          sources = module.read_sources('deploy/openwebui-knowledge/portal-help')
          assert sources
          skill = Path('deploy/openwebui-skills/portal-help.md').read_text(encoding='utf-8')
          assert module.MARKER in skill
          assert 'references/knowledge-index.md' in skill
          PY
