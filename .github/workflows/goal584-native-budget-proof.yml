            -f compose/goal584.webui-proof.yml up -d --scale proxy=1 --wait --wait-timeout 180 proxy
          mkdir -p "$PROOF_OUTPUT_DIR/rag"
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" -B scripts/goal584-budget-proof/prove_rag_service.py \
            --base-url "$PROOF_WEBUI_URL" --env-file "$PROOF_ENV_FILE" \
            --accounts "$PROOF_PRIVATE_DIR/browser-accounts.private.json" --output "$PROOF_OUTPUT_DIR/rag" \
            --prior-pricing-receipt "$PROOF_OUTPUT_DIR/pricing/pricing-browser.json" \
            --prior-overlap-receipt "$PROOF_OUTPUT_DIR/overlap/overlap.safe.json"

      - name: Qualify ordinary Responses chat and its native budget ledger after RAG
        if: env.STREAM_COMPONENT_ONLY != 'true'
        timeout-minutes: 40
        shell: bash
        run: |
          mkdir -p "$PROOF_OUTPUT_DIR/responses"
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" -B scripts/goal584-budget-proof/prove_responses_chat.py \
            --base-url "$PROOF_WEBUI_URL" --accounts "$PROOF_PRIVATE_DIR/browser-accounts.private.json" \
            --env-file "$PROOF_ENV_FILE" --output "$PROOF_OUTPUT_DIR/responses"

      - name: Show bounded sanitized startup diagnostics on failure
        timeout-minutes: 2
        if: failure() && (env.STREAM_COMPONENT_ONLY != 'true' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product'))
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          env_file = Path(os.environ['PROOF_ENV_FILE'])
          if env_file.exists():
              command = ['docker', 'compose', '--env-file', str(env_file), '-f', 'compose/goal584.native-budget-proof.yml']
              services=['proxy']
              if os.environ['ACCEPTANCE_PROFILE'] not in ('stream-ledger','file-service'):
                  command += ['-f', 'compose/goal584.webui-proof.yml'];services += ['webui']
              result = subprocess.run(command + ['logs', '--no-color', '--tail', '200', *services], capture_output=True, text=True,timeout=30)
              output = result.stdout + result.stderr
              for line in env_file.read_text(encoding='utf-8').splitlines():
                  output = output.replace(line.split('=', 1)[1], '[redacted]')
              output = re.sub(r'sk-[A-Za-z0-9_-]+', '[synthetic-key-redacted]', output)
              output = re.sub(r'postgresql://[^\s]+', '[database-url-redacted]', output)
              output = re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[session-redacted]', output)
              Path(os.environ['PROOF_OUTPUT_DIR'],'startup-diagnostics.log').write_text(output,encoding='utf-8')
              print(output)
          PY

      - name: Remove the disposable backend and its data
        timeout-minutes: 5
        if: always()
        shell: bash
        run: |
          if test "$ACCEPTANCE_PROFILE" = monthly-api || test "$ACCEPTANCE_PROFILE" = gui-product; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
              -f compose/goal584.webui-proof.yml down --volumes --remove-orphans --timeout 20
          elif test "$ACCEPTANCE_PROFILE" = stream-ledger || test "$ACCEPTANCE_PROFILE" = file-service; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml down --volumes --remove-orphans --timeout 20
          fi
          if test "$STREAM_COMPONENT_ONLY" = true; then
            python -B - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          owner='goal584-stream-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          label='label=goal584.owner='+owner
          ids=lambda:subprocess.check_output(['docker','ps','-aq','--filter',label],text=True).split()
          owned=ids()
          if owned:subprocess.run(['docker','rm','-f',*owned],check=True,timeout=30)
          iid=Path(os.environ['RUNNER_TEMP'],'goal584-native-floor-build/image-id.txt')
          image=iid.read_text().strip() if iid.exists() else None
          if image:
              assert re.fullmatch('sha256:[0-9a-f]{64}',image)
              data=json.loads(subprocess.check_output(['docker','image','inspect',image]))[0]
              assert data['Id']==image and data['Config']['Labels']['org.alpha-soft.goal584.native-variant']==os.environ['PROOF_NATIVE_VARIANT']
              subprocess.run(['docker','image','rm','--no-prune',image],check=True,timeout=30)
          packet={'owner':owner,'remaining_containers':ids(),'removed_image_id':image}
          assert not packet['remaining_containers']
          if os.environ['ACCEPTANCE_PROFILE'] in ('stream-ledger','file-service','monthly-api','gui-product'):
              label='label=com.docker.compose.project=goal584-native-budget-proof'
              remaining={kind:subprocess.check_output(['docker',*command,'--filter',label],text=True).split()
                  for kind,command in {'containers':['ps','-aq'],'volumes':['volume','ls','-q'],'networks':['network','ls','-q']}.items()}
              packet['native_project_remaining']=remaining
              assert not any(remaining.values()),'Owned native backend resources remain'
          Path(os.environ['PROOF_OUTPUT_DIR'],'stream-cleanup.safe.json').write_text(json.dumps(packet,indent=2)+'\n')
          PY
          fi
          if test "$STREAM_COMPONENT_ONLY" != true && test -f "$PROOF_ENV_FILE"; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
              -f compose/goal584.webui-proof.yml down --volumes --remove-orphans
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          label = 'label=com.docker.compose.project=goal584-native-budget-proof'
          containers = subprocess.check_output(['docker', 'ps', '-aq', '--filter', label], text=True).split()
          volumes = subprocess.check_output(['docker', 'volume', 'ls', '-q', '--filter', label], text=True).split()
          receipt = {'project': 'goal584-native-budget-proof', 'remaining_containers': containers, 'remaining_volumes': volumes}
          Path(os.environ['PROOF_OUTPUT_DIR'], 'cleanup.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          assert not containers and not volumes, 'Disposable proof resources remain'
          PY
          fi

      - name: Retain the synthetic qualification receipts
        timeout-minutes: 2
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goal584-native-budget-proof-${{ github.sha }}
          path: ${{ runner.temp }}/goal584-native-budget-proof/
          if-no-files-found: warn
          retention-days: 7

  native-pricing-catalog:
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance == 'full'
    runs-on: ubuntu-24.04
    # Reference check + versions + used categories: 92m phase bounds + 3m reserve.
    timeout-minutes: 95
    steps:
      - name: Check out the pricing candidate
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare the dedicated pricing project
        timeout-minutes: 1
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          nonce = secrets.token_hex(6)
          private = Path(os.environ['RUNNER_TEMP'],'goal584-pricing-'+nonce+'-private')
          output = Path(os.environ['RUNNER_TEMP'],'goal584-pricing-proof-'+nonce)
          private.mkdir(mode=0o700);output.mkdir()
          config = private/'config.yaml'
          raw = Path('scripts/goal584-budget-proof/litellm_config.yaml').read_text(encoding='utf-8')
          assert raw.count('\ngeneral_settings:\n') == 1
          raw = raw.replace('\ngeneral_settings:\n','\ngeneral_settings:\n  disable_reset_budget: true\n')
          with os.fdopen(os.open(config,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w',encoding='utf-8') as handle:
              handle.write(raw)
          paths = {'PRICING_PROJECT':'goal584-pricing-'+nonce,'PROOF_SOURCE_COMMIT':os.environ['GITHUB_SHA'],
                   'PROOF_ENV_FILE':str(private/'proof.env'),'PROOF_PRIVATE_DIR':str(private),
                   'PROOF_CONFIG_FILE':str(config),'PROOF_OUTPUT_DIR':str(output)}
          values = {**paths,'PROOF_MASTER_KEY':'sk-'+secrets.token_hex(32),
                    'PROOF_DB_PASSWORD':secrets.token_hex(32),'OWUI_BUDGET_GATEWAY_SECRET':'gw-'+secrets.token_hex(32)}
          with os.fdopen(os.open(paths['PROOF_ENV_FILE'],os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w',encoding='utf-8') as handle:
              for key,value in values.items():
                  handle.write(key+'='+value+'\n')
                  if key in ('PROOF_MASTER_KEY','PROOF_DB_PASSWORD','OWUI_BUDGET_GATEWAY_SECRET'):
                      print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              for key,value in paths.items():handle.write(key+'='+value+'\n')
              handle.write('PRICING_PROJECT_CLAIMED=false\n')
          PY

      - name: Build the reviewed pricing native derivative
        timeout-minutes: 10
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/goal584-native-patch-venv"
          "$RUNNER_TEMP/goal584-native-patch-venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/goal584-budget-proof/native-patch-requirements.txt
          "$RUNNER_TEMP/goal584-native-patch-venv/bin/python" scripts/goal584-budget-proof/build_native_floor_image.py \
            --context "$RUNNER_TEMP/goal584-pricing-native-build" --receipt "$PROOF_OUTPUT_DIR/native-build.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'],'native-build.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write('PROOF_LITELLM_IMAGE='+receipt['image_ref']+'\n')
          PY

      - name: Start only the fresh pricing backend
        timeout-minutes: 7
        shell: bash
        run: |
          label="label=com.docker.compose.project=$PRICING_PROJECT"
          existing_containers=$(docker ps -aq --filter "$label")
          test -z "$existing_containers"
          existing_volumes=$(docker volume ls -q --filter "$label")
          test -z "$existing_volumes"
          existing_networks=$(docker network ls -q --filter "$label")
          test -z "$existing_networks"
          printf 'PRICING_PROJECT_CLAIMED=true\n' >> "$GITHUB_ENV"
          docker compose -p "$PRICING_PROJECT" --env-file "$PROOF_ENV_FILE" \
            -f compose/goal584.native-budget-proof.yml -f compose/goal584.pricing-proof.yml config --quiet
          docker compose -p "$PRICING_PROJECT" --env-file "$PROOF_ENV_FILE" \
            -f compose/goal584.native-budget-proof.yml -f compose/goal584.pricing-proof.yml \
            up -d --wait --wait-timeout 240 --scale proxy=1

      - name: Attest the pricing containers and immutable source closure
        timeout-minutes: 3
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,ipaddress,json,os,re,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'deploy/litellm-patches/positive-floor-v1.105.1')
          sys.path.insert(0,'scripts/goal584-budget-proof')
          import native_floor_identity as sdk
          import prove_pricing_catalog as proof
          project = os.environ['PRICING_PROJECT']
          assert re.fullmatch('goal584-pricing-[0-9a-f]{12}',project)
          command = ['docker','compose','-p',project,'--env-file',os.environ['PROOF_ENV_FILE'],
                     '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.pricing-proof.yml']
          def read(argv):return subprocess.check_output(argv,text=True,timeout=60).strip()
          revision = read(['git','rev-parse','HEAD'])
          assert revision == os.environ['GITHUB_SHA'] == os.environ['PROOF_SOURCE_COMMIT']
          build = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'],'native-build.json').read_text())
          artifact = sdk.verify_build(build)
          resolved = json.loads(read(command+['config','--format','json']))
          credentials = dict(line.split('=',1) for line in Path(os.environ['PROOF_ENV_FILE']).read_text().splitlines() if line)
          assert set(resolved['services']) == {'proxy','postgres','redis','provider'}
          assert resolved['networks']['proof']['internal'] is True
          assert not any(service.get('ports') for service in resolved['services'].values())
          readonly = {}
          for item in resolved['services']['proxy']['volumes']:
              assert item['type'] == 'bind'
              if item['target'] == '/proof-private':
                  assert item['source'] == str(Path(os.environ['PROOF_PRIVATE_DIR']).resolve()) and not item.get('read_only',False)
              else:
                  assert item['read_only'] is True and item['target'] not in readonly
                  readonly[item['target']] = item['source']
          assert readonly['/proof/config.yaml'] == str(Path(os.environ['PROOF_CONFIG_FILE']).resolve())
          mounted = {target:Path(source).resolve().relative_to(Path.cwd()).as_posix()
                     for target,source in readonly.items() if target != '/proof/config.yaml'}
          assert mounted['/proof/prove_pricing_catalog.py'] == 'scripts/goal584-budget-proof/prove_pricing_catalog.py'
          assert mounted['/proof/prove_pricing_usage.py'] == 'scripts/goal584-budget-proof/prove_pricing_usage.py'
          assert mounted['/proof/pricing_snapshot.py'] == 'deploy/openwebui-budgets/pricing_snapshot.py'
          required = ['.github/workflows/goal584-native-budget-proof.yml','compose/goal584.native-budget-proof.yml',
                      'compose/goal584.pricing-proof.yml','scripts/goal584-budget-proof/litellm_config.yaml',
                      'scripts/goal584-budget-proof/mock_provider.py','scripts/goal584-budget-proof/test_mock_provider.py',
                      'scripts/goal584-budget-proof/test_pricing_catalog.py','deploy/openwebui-budgets/tests/test_pricing_snapshot.py',
                      'scripts/goal584-budget-proof/test_pricing_versions.py',
                      'scripts/goal584-budget-proof/test_pricing_usage.py',
                      'scripts/goal584-budget-proof/test_pricing_usage_provider.py',
                      'scripts/goal584-budget-proof/native-patch-requirements.txt',*build['files_sha256'],*mounted.values()]
          hashes = {}
          for name in dict.fromkeys(required):
              data = Path(name).read_bytes()
              assert data == subprocess.check_output(['git','show',revision+':'+name]), 'Pricing source differs from tested Git'
              hashes[name] = hashlib.sha256(data).hexdigest()
          helpers = proof.source_files()
          assert helpers == {name:hashes[mounted['/proof/'+name]] for name in helpers}
          assert proof.PROVIDER_SHA == hashes['scripts/goal584-budget-proof/mock_provider.py']
          code = 'import hashlib,json,pathlib,sys;print(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sys.argv[1:]}))'
          native_code = 'import hashlib,importlib.util,json,pathlib,sys;root=pathlib.Path(importlib.util.find_spec("litellm").origin).parent;print(json.dumps({p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sys.argv[1:]}))'
          sdk_code = "import json,sys;sys.path.insert(0,'/proof');import native_floor_identity as n;print(json.dumps(n.inspect_sources()))"
          config_hash = hashlib.sha256(Path(os.environ['PROOF_CONFIG_FILE']).read_bytes()).hexdigest()
          ids = read(command+['ps','-q']).split();assert len(ids)==len(set(ids))==4
          containers,actual_mounts,seen_ids = {},{},set()
          for service in ('proxy','postgres','redis','provider'):
              current = read(command+['ps','-q',service]).split();assert len(current)==1
              item = json.loads(read(['docker','inspect',current[0]]))[0]
              labels = item['Config']['Labels'];identifier = item['Id']
              assert re.fullmatch('[0-9a-f]{64}',identifier) and labels['com.docker.compose.project']==project
              assert identifier==current[0] and identifier in ids and identifier not in seen_ids
              seen_ids.add(identifier)
              assert labels['com.docker.compose.service']==service and labels['com.docker.compose.container-number']=='1'
              assert item['State']['Health']['Status']=='healthy' and item['HostConfig']['NetworkMode']==project+'_proof'
              assert set(item['NetworkSettings']['Networks'])=={project+'_proof'}
              address = ipaddress.IPv4Address(item['NetworkSettings']['Networks'][project+'_proof']['IPAddress'])
              assert address.is_private and not(address.is_loopback or address.is_link_local or address.is_multicast or address.is_unspecified)
              expected = sdk.image_ref() if service=='proxy' else proof.IMAGES[service]
              assert item['Config']['Image']==expected and re.fullmatch('sha256:[0-9a-f]{64}',item['Image'])
              if service=='proxy':assert item['Image']==expected and item['Config']['Cmd']==proof.COMMAND
              containers[service] = {'id':identifier,'number':'1','image_ref':item['Config']['Image'],
                  'image_id':item['Image'],'health':'healthy','network':project+'_proof'}
              environment = dict(pair.split('=',1) for pair in item['Config']['Env'])
              if service=='postgres':
                  assert environment['POSTGRES_DB']=='goal584_pricing' and environment['POSTGRES_USER']=='goal584'
                  assert environment['POSTGRES_PASSWORD']==credentials['PROOF_DB_PASSWORD']
              if service=='provider':
                  assert environment.get('PROOF_CATALOG_ENABLED')=='true' and not environment.get('PROOF_CATALOG_CORPUS_PATH')
                  mount, = [value for value in item['Mounts'] if value['Type']=='bind']
                  assert mount['Destination']=='/proof/mock_provider.py' and mount['RW'] is False
                  assert mount['Source']==str(Path('scripts/goal584-budget-proof/mock_provider.py').resolve())
                  continue
              if service!='proxy':continue
              assert environment['DATABASE_URL']=='postgresql://goal584:'+credentials['PROOF_DB_PASSWORD']+'@postgres:5432/goal584_pricing'
              assert environment['PROOF_MASTER_KEY']==credentials['PROOF_MASTER_KEY']
              assert environment['PROOF_SOURCE_COMMIT']==revision and environment['PROOF_PRICING_PROJECT']==project
              assert environment['LITELLM_MODEL_COST_MAP_URL']==proof.CATALOG and environment['LITELLM_LOCAL_MODEL_COST_MAP'].lower()=='false'
              binds = [value for value in item['Mounts'] if value['Type']=='bind']
              assert len(binds)==len({value['Destination'] for value in binds})==len(readonly)+1
              assert {value['Destination'] for value in binds}=={*readonly,'/proof-private'}
              for target,source in {**readonly,'/proof-private':os.environ['PROOF_PRIVATE_DIR']}.items():
                  mount = next(value for value in binds if value['Destination']==target)
                  assert mount['Source']==str(Path(source).resolve()) and mount['RW'] is (target=='/proof-private')
              execute = command+['exec','-T','proxy','python','-B','-c']
              actual_mounts = json.loads(read(execute+[code,*readonly]))
              assert actual_mounts == {target:config_hash if target=='/proof/config.yaml' else hashes[mounted[target]] for target in readonly}
              assert json.loads(read(execute+[sdk_code]))=={'native_sha256':sdk.selected_hashes({k.removeprefix('litellm/'):v for k,v in sdk.load_manifest()['native_export_sha256'].items()}),'native_artifact':artifact}
              assert json.loads(read(execute+[native_code,*proof.NATIVE]))==proof.NATIVE
          assert seen_ids==set(ids)
          provider = json.loads(read(command+['exec','-T','provider','python','-B','-c',code,'/proof/mock_provider.py']))
          assert provider=={'/proof/mock_provider.py':proof.PROVIDER_SHA}
          assert json.loads(read(command+['exec','-T','provider','python','-B','-c',native_code,'model_prices_and_context_window_backup.json']))=={'model_prices_and_context_window_backup.json':proof.NATIVE['model_prices_and_context_window_backup.json']}
          attest = {'schema':1,'proof':proof.PROOF,'project':project,'source_commit':revision,'containers':containers,
                    'proxy_command':proof.COMMAND,'config_sha256':config_hash,'files_sha256':helpers,
                    'provider_sha256':proof.PROVIDER_SHA,'native_artifact':artifact}
          private = Path(os.environ['PROOF_PRIVATE_DIR'],'catalog-attestation.private.json')
          with os.fdopen(os.open(private,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w',encoding='utf-8') as handle:
              json.dump(attest,handle)
          receipt = {**attest,'files_sha256':hashes,'mounted_sha256':actual_mounts,'provider_sha256':provider,
                     'native_cost_map_sources':proof.NATIVE,'scope':'Dedicated synthetic reference-check profile, no inference/version activation'}
          Path(os.environ['PROOF_OUTPUT_DIR'],'runtime-identity.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          PY

      - name: Qualify the first native scheduled reference check
        timeout-minutes: 4
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          private,output = Path(os.environ['PROOF_PRIVATE_DIR']),Path(os.environ['PROOF_OUTPUT_DIR'])
          command = ['docker','compose','-p',os.environ['PRICING_PROJECT'],'--env-file',os.environ['PROOF_ENV_FILE'],
                     '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.pricing-proof.yml']
          argv = command+['exec','-T','proxy','python','-B','/proof/prove_pricing_catalog.py','--project',os.environ['PRICING_PROJECT'],
                          '--attestation','/proof-private/catalog-attestation.private.json','--private-state','/proof-private/catalog-state.private.json',
                          '--receipt','/proof-private/catalog.safe.json']
          status = -1
          try:status = subprocess.run(argv,capture_output=True,timeout=190).returncode
          except (OSError,subprocess.TimeoutExpired):pass
          # Only the source-bound safe producer's packet is copied out. Arbitrary
          # native stdout/stderr and raw private observations are never exported.
          safe = 'import pathlib,sys;sys.stdout.buffer.write(pathlib.Path("/proof-private/catalog.safe.json").read_bytes())'
          child = subprocess.run(command+['exec','-T','proxy','python','-B','-c',safe],capture_output=True,timeout=20)
          assert child.returncode==0 and len(child.stdout)<=4*1024*1024,'Pricing safe packet unavailable'
          receipt = json.loads(child.stdout)
          secrets = [line.split('=',1)[1] for line in Path(os.environ['PROOF_ENV_FILE']).read_text().splitlines()
                     if line.split('=',1)[0] in ('PROOF_MASTER_KEY','PROOF_DB_PASSWORD','OWUI_BUDGET_GATEWAY_SECRET')]
          assert not any(value and value.encode() in child.stdout for value in secrets)
          assert not re.search(rb'(?:sk-|gw-|Bearer\s)[A-Za-z0-9_-]{12,}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',child.stdout)
          assert receipt['schema']==1 and receipt['proof']=='goal584-native-pricing-catalog'
          assert receipt['project']==os.environ['PRICING_PROJECT'] and receipt['source_commit']==os.environ['GITHUB_SHA']
          (output/'catalog.safe.json').write_bytes(child.stdout)
          (output/'helper-diagnostic.json').write_text(json.dumps({'helper_returncode':status,'passed':receipt.get('passed'),
              'stage':receipt.get('stage'),'failure_code':receipt.get('failure_code')},indent=2),encoding='utf-8')
          assert status==0 and receipt['passed'] is True,'Native pricing reference check failed; inspect safe packet'
          PY

      - name: Qualify immutable synthetic tariff versions on the same native owner
        timeout-minutes: 30
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          output = Path(os.environ['PROOF_OUTPUT_DIR'])
          candidate = Path(os.environ['RUNNER_TEMP'],os.environ['PRICING_PROJECT']+'-versions-safe')
          candidate.mkdir(mode=0o700)
          receipt_path = candidate/'versions.safe.json'
          script = 'scripts/goal584-budget-proof/prove_pricing_versions.py'
          expected = subprocess.check_output(['git','show',os.environ['GITHUB_SHA']+':'+script])
          assert Path(script).read_bytes()==expected,'Version host differs from tested Git'
          interpreter = str(Path(os.environ['RUNNER_TEMP'],'goal584-native-patch-venv','bin','python'))
          argv = [interpreter,'-B',script,'--project',os.environ['PRICING_PROJECT'],
                  '--env-file',os.environ['PROOF_ENV_FILE'],'--private-root',os.environ['PROOF_PRIVATE_DIR'],
                  '--compose-file','compose/goal584.native-budget-proof.yml',
                  '--compose-file','compose/goal584.pricing-proof.yml','--receipt',str(receipt_path)]
          status = -1
          try:status = subprocess.run(argv,capture_output=True,timeout=1500).returncode
          except (OSError,subprocess.TimeoutExpired):pass
          diagnostic = {'helper_returncode':status,'project':os.environ['PRICING_PROJECT'],
                        'source_commit':os.environ['GITHUB_SHA'],'host_sha256':hashlib.sha256(expected).hexdigest(),
                        'receipt_written':receipt_path.is_file()}
          (output/'versions-helper-diagnostic.json').write_text(json.dumps(diagnostic,indent=2),encoding='utf-8')
          assert receipt_path.is_file() and receipt_path.stat().st_size<=4*1024*1024,'Version safe packet unavailable'
          raw = receipt_path.read_bytes()
          secrets = [line.split('=',1)[1] for line in Path(os.environ['PROOF_ENV_FILE']).read_text().splitlines()
                     if line.split('=',1)[0] in ('PROOF_MASTER_KEY','PROOF_DB_PASSWORD','OWUI_BUDGET_GATEWAY_SECRET')]
          assert not any(value and value.encode() in raw for value in secrets)
          assert not re.search(rb'(?:sk-|gw-|Bearer\s)[A-Za-z0-9_-]{12,}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',raw)
          packet = json.loads(raw)
          assert set(packet)=={'schema','proof','passed','action','result','failure_code'}
          assert packet['schema']==1 and packet['proof']=='goal584-controlled-pricing-versions' and packet['action'] is None
          (output/'versions.safe.json').write_bytes(raw)
          assert status==0 and packet['passed'] is True and packet['result']['passed'] is True,'Native tariff version qualification failed'
          PY

      - name: Qualify native cached and reasoning tariffs and observe missing usage
        timeout-minutes: 30
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          output = Path(os.environ['PROOF_OUTPUT_DIR'])
          candidate = Path(os.environ['RUNNER_TEMP'],os.environ['PRICING_PROJECT']+'-usage-safe')
          candidate.mkdir(mode=0o700)
          receipt_path = candidate/'usage.safe.json'
          script = 'scripts/goal584-budget-proof/prove_pricing_usage.py'
          expected = subprocess.check_output(['git','show',os.environ['GITHUB_SHA']+':'+script])
          assert Path(script).read_bytes()==expected,'Usage host differs from tested Git'
          interpreter = str(Path(os.environ['RUNNER_TEMP'],'goal584-native-patch-venv','bin','python'))
          argv = [interpreter,'-B',script,'--project',os.environ['PRICING_PROJECT'],
                  '--env-file',os.environ['PROOF_ENV_FILE'],'--private-root',os.environ['PROOF_PRIVATE_DIR'],
                  '--compose-file','compose/goal584.native-budget-proof.yml',
                  '--compose-file','compose/goal584.pricing-proof.yml','--receipt',str(receipt_path)]
          status = -1
          try:status = subprocess.run(argv,capture_output=True,timeout=1500).returncode
          except (OSError,subprocess.TimeoutExpired):pass
          diagnostic = {'helper_returncode':status,'project':os.environ['PRICING_PROJECT'],
                        'source_commit':os.environ['GITHUB_SHA'],'host_sha256':hashlib.sha256(expected).hexdigest(),
                        'receipt_written':receipt_path.is_file()}
          (output/'usage-helper-diagnostic.json').write_text(json.dumps(diagnostic,indent=2),encoding='utf-8')
          assert receipt_path.is_file() and receipt_path.stat().st_size<=4*1024*1024,'Usage safe packet unavailable'
          raw = receipt_path.read_bytes()
          secrets = [line.split('=',1)[1] for line in Path(os.environ['PROOF_ENV_FILE']).read_text().splitlines()
                     if line.split('=',1)[0] in ('PROOF_MASTER_KEY','PROOF_DB_PASSWORD','OWUI_BUDGET_GATEWAY_SECRET')]
          assert not any(value and value.encode() in raw for value in secrets)
          assert not re.search(rb'(?:sk-|gw-|Bearer\s)[A-Za-z0-9_-]{12,}|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',raw)
          packet = json.loads(raw)
          assert set(packet)=={'schema','proof','passed','action','result','failure_code'}
          assert packet['schema']==1 and packet['proof']=='goal584-native-pricing-used-categories' and packet['action'] is None
          (output/'usage.safe.json').write_bytes(raw)
          assert status==0 and packet['passed'] is True and packet['result']['passed'] is True,'Native used-category qualification failed'
          assert packet['result']['unknown_rows_finality'] is False and packet['result']['negative_cases_are_policy_qualification'] is False
          PY

      - name: Remove the pricing project and verify cleanup
        timeout-minutes: 3
        if: always() && env.PRICING_PROJECT_CLAIMED == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          project = os.environ['PRICING_PROJECT'];assert re.fullmatch('goal584-pricing-[0-9a-f]{12}',project)
          command = ['docker','compose','-p',project,'--env-file',os.environ['PROOF_ENV_FILE'],
                     '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.pricing-proof.yml']
          status = -1
          try:status = subprocess.run(command+['down','--volumes','--remove-orphans'],capture_output=True,timeout=100).returncode
          except (OSError,subprocess.TimeoutExpired):pass
          label = 'label=com.docker.compose.project='+project
          remaining = {name:subprocess.check_output(argv+['--filter',label],text=True,timeout=15).split() for name,argv in (
              ('containers',['docker','ps','-aq']),('volumes',['docker','volume','ls','-q']),('networks',['docker','network','ls','-q']))}
          Path(os.environ['PROOF_OUTPUT_DIR'],'cleanup.json').write_text(json.dumps({'project':project,'down_returncode':status,**remaining},indent=2),encoding='utf-8')
          assert status==0 and not any(remaining.values()),'Pricing cleanup incomplete'
          PY

      - name: Retain only safe pricing evidence
        timeout-minutes: 2
        if: always() && env.PROOF_OUTPUT_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goal584-pricing-catalog-${{ github.sha }}
          path: ${{ env.PROOF_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7

  native-calendar-reset:
    if: github.event_name != 'workflow_dispatch' || inputs.acceptance == 'full'
    runs-on: ubuntu-24.04
    # Bound each phase and reserve time for always-cleanup after both startup
    # waits and a timed-out floor helper. Native 5s/60s clocks are unchanged.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [basic, positive-floor]
    env:
      CALENDAR_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Check out the calendar candidate
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare a separate disposable calendar project
        timeout-minutes: 1
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          profile = os.environ['CALENDAR_PROFILE']
          assert profile in ('basic', 'positive-floor')
          nonce = secrets.token_hex(6)
          private = root / ('goal584-calendar-' + profile + '-' + nonce + '-private')
          private.mkdir(mode=0o700)
          output = root / ('goal584-calendar-proof-' + profile + '-' + nonce)
          output.mkdir()
          config = private / 'config.yaml'
          raw = Path('scripts/goal584-budget-proof/litellm_config.yaml').read_text(encoding='utf-8')
          assert raw.count('\ngeneral_settings:\n') == raw.count('\nlitellm_settings:\n') == 1
          raw = raw.replace('\ngeneral_settings:\n', '\ngeneral_settings:\n  disable_reset_budget: true\n')
          raw = raw.replace('\nlitellm_settings:\n', '\nlitellm_settings:\n  timezone: Europe/Moscow\n  budget_reset_time: "00:00"\n  budget_rollover: false\n')
          with os.fdopen(os.open(config, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w', encoding='utf-8') as handle:
              handle.write(raw)
          project = 'goal584-calendar-' + nonce
          paths = {'CALENDAR_PROJECT': project, 'PROOF_ENV_FILE': str(private / 'proof.env'),
                   'PROOF_PRIVATE_DIR': str(private), 'PROOF_CONFIG_FILE': str(config),
                   'PROOF_OUTPUT_DIR': str(output)}
          values = {**paths, 'PROOF_MASTER_KEY': 'sk-' + secrets.token_hex(32),
                    'PROOF_DB_PASSWORD': secrets.token_hex(32),
                    'OWUI_BUDGET_GATEWAY_SECRET': 'gw-' + secrets.token_hex(32)}
          with os.fdopen(os.open(paths['PROOF_ENV_FILE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
                  if key in ('PROOF_MASTER_KEY', 'PROOF_DB_PASSWORD', 'OWUI_BUDGET_GATEWAY_SECRET'):
                      print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in paths.items():
                  handle.write(f'{key}={value}\n')
              handle.write('CALENDAR_PROJECT_CLAIMED=false\n')
          PY

      - name: Build the reviewed calendar native derivative
        timeout-minutes: 10
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/goal584-native-patch-venv"
          "$RUNNER_TEMP/goal584-native-patch-venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/goal584-budget-proof/native-patch-requirements.txt
          "$RUNNER_TEMP/goal584-native-patch-venv/bin/python" scripts/goal584-budget-proof/build_native_floor_image.py \
            --context "$RUNNER_TEMP/goal584-native-floor-build" --receipt "$PROOF_OUTPUT_DIR/native-build.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'],'native-build.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write('PROOF_LITELLM_IMAGE='+receipt['image_ref']+'\n')
          PY

      - name: Start only the fresh calendar backend
        timeout-minutes: 9
        shell: bash
        run: |
          label="label=com.docker.compose.project=$CALENDAR_PROJECT"
          calendar_containers=$(docker ps -aq --filter "$label")
          calendar_volumes=$(docker volume ls -q --filter "$label")
          calendar_networks=$(docker network ls -q --filter "$label")
          test -z "$calendar_containers"
          test -z "$calendar_volumes"
          test -z "$calendar_networks"
          # A failed freshness guard must never authorize deleting pre-existing
          # resources. Claim only this empty project before any partial startup.
          printf 'CALENDAR_PROJECT_CLAIMED=true\n' >> "$GITHUB_ENV"
          docker compose -p "$CALENDAR_PROJECT" --env-file "$PROOF_ENV_FILE" \
            -f compose/goal584.native-budget-proof.yml -f compose/goal584.calendar-proof.yml config --quiet
          docker compose -p "$CALENDAR_PROJECT" --env-file "$PROOF_ENV_FILE" \
            -f compose/goal584.native-budget-proof.yml -f compose/goal584.calendar-proof.yml \
            up -d --wait --wait-timeout 240 --scale proxy=1
          if test "$CALENDAR_PROFILE" = positive-floor; then
            # Settle native Prisma on one worker before starting the cold peer.
            docker compose -p "$CALENDAR_PROJECT" --env-file "$PROOF_ENV_FILE" \
              -f compose/goal584.native-budget-proof.yml -f compose/goal584.calendar-proof.yml \
              up -d --wait --wait-timeout 240 --scale proxy=2
          fi

      - name: Attest calendar containers and their exact mounted sources
        timeout-minutes: 3
        shell: bash
        run: |
          python - <<'PY'
          import ast, hashlib, ipaddress, json, os, re, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'deploy/litellm-patches/positive-floor-v1.105.1')
          import native_floor_identity as native_sdk
          build = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'],'native-build.json').read_text())
          artifact = native_sdk.verify_build(build)
          project = os.environ['CALENDAR_PROJECT']
          profile = os.environ['CALENDAR_PROFILE']
          assert profile in ('basic', 'positive-floor')
          floor = profile == 'positive-floor'
          assert re.fullmatch(r'goal584-calendar-[0-9a-f]{12}', project)
          command = ['docker','compose','-p',project,'--env-file',os.environ['PROOF_ENV_FILE'],
                     '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.calendar-proof.yml']
          def read(argv):
              return subprocess.check_output(argv, text=True).strip()
          rev = read(['git','rev-parse','HEAD'])
          assert rev == os.environ['GITHUB_SHA']
          def literal(path, name):
              nodes = ast.parse(Path(path).read_bytes()).body
              return ast.literal_eval(next(node.value for node in nodes if isinstance(node,ast.Assign)
                  and any(isinstance(target,ast.Name) and target.id == name for target in node.targets)))
          mounted = {'/proof/prove_calendar_reset.py':'scripts/goal584-budget-proof/prove_calendar_reset.py',
                     '/proof/prove_calendar_floor.py':'scripts/goal584-budget-proof/prove_calendar_floor.py',
                     '/proof/prove_budget_overlap.py':'scripts/goal584-budget-proof/prove_budget_overlap.py',
                     '/proof/prove_native_budgets.py':'scripts/goal584-budget-proof/prove_native_budgets.py',
                     '/proof/prove_gateway_auth.py':'scripts/goal584-budget-proof/prove_gateway_auth.py',
                     '/proof/budget_errors.py':'deploy/openwebui-budgets/budget_errors.py',
                     '/proof/pricing_snapshot.py':'deploy/openwebui-budgets/pricing_snapshot.py',
                     '/proof/employee_budget_assignment.py':'deploy/openwebui-budgets/assignment.py',
                     '/proof/litellm_auth.py':'deploy/openwebui-budgets/litellm_auth.py',
                     '/proof/prove_pricing_snapshots.py':'scripts/goal584-budget-proof/prove_pricing_snapshots.py',
                     '/proof/native_floor_identity.py':'deploy/litellm-patches/positive-floor-v1.105.1/native_floor_identity.py',
                     '/proof/manifest.json':'deploy/litellm-patches/positive-floor-v1.105.1/manifest.json'}
          files = ['.github/workflows/goal584-native-budget-proof.yml','compose/goal584.native-budget-proof.yml',
                   'compose/goal584.calendar-proof.yml','scripts/goal584-budget-proof/litellm_config.yaml',
                   'scripts/goal584-budget-proof/init_vector_database.sql','scripts/goal584-budget-proof/mock_provider.py',
                   'scripts/goal584-budget-proof/test_calendar_floor.py','scripts/goal584-budget-proof/test_calendar_reset.py',
                   'scripts/goal584-budget-proof/test_budget_overlap.py',
                   'scripts/goal584-budget-proof/native-patch-requirements.txt',*build['files_sha256'],*mounted.values()]
          hashes = {}
          for name in dict.fromkeys(files):
              data = Path(name).read_bytes()
              assert data == subprocess.check_output(['git','show',rev+':'+name]), 'Source differs from tested Git commit'
              hashes[name] = hashlib.sha256(data).hexdigest()
          helpers = literal('scripts/goal584-budget-proof/prove_calendar_floor.py','HELPERS')
          helpers['prove_calendar_floor.py'] = hashes['scripts/goal584-budget-proof/prove_calendar_floor.py']
          assert len(helpers) == 10 and all(hashes[mounted['/proof/'+name]] == digest for name,digest in helpers.items())
          native = literal('scripts/goal584-budget-proof/prove_calendar_reset.py','NATIVE_HASHES')
          if floor:
              native.update(literal('scripts/goal584-budget-proof/prove_calendar_floor.py','EXTRA_NATIVE'))
          native = native_sdk.selected_hashes(native)
          assert len(native) == (18 if floor else 10)
          code = 'import hashlib,json,pathlib,sys;print(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in sys.argv[1:]}))'
          native_code = 'import hashlib,importlib.util,json,pathlib,sys;root=pathlib.Path(importlib.util.find_spec("litellm").origin).parent;print(json.dumps({p:hashlib.sha256((root/p).read_bytes()).hexdigest() for p in sys.argv[1:]}))'
          config_hash = hashlib.sha256(Path(os.environ['PROOF_CONFIG_FILE']).read_bytes()).hexdigest()
          attest = {'schema':1, 'project':project}
          images, workers, mounted_workers = [], [], {}
          assert len(read(command + ['ps','-q']).split()) == (5 if floor else 4)
          for service in ('proxy','postgres','redis','provider'):
              ids = read(command + ['ps','-q',service]).split()
              assert len(ids) == (2 if floor and service == 'proxy' else 1)
              for identifier in ids:
                  assert re.fullmatch('[0-9a-f]{64}',identifier)
                  item = json.loads(read(['docker','inspect',identifier]))[0]
                  labels = item['Config']['Labels']
                  assert labels['com.docker.compose.project'] == project and labels['com.docker.compose.service'] == service
                  assert item['State']['Health']['Status'] == 'healthy'
                  if service == 'proxy':
                      assert item['Config']['Image'] == item['Image'] == native_sdk.image_ref()
                  else:
                      assert '@sha256:' in item['Config']['Image']
                  assert re.fullmatch('sha256:[0-9a-f]{64}',item['Image'])
                  assert item['HostConfig']['NetworkMode'] == project+'_proof'
                  assert set(item['NetworkSettings']['Networks']) == {project+'_proof'}
                  address = item['NetworkSettings']['Networks'][project+'_proof']['IPAddress']
                  ipv4 = ipaddress.IPv4Address(address)
                  assert ipv4.is_private and not (ipv4.is_loopback or ipv4.is_link_local or ipv4.is_unspecified or ipv4.is_multicast)
                  images.append({'service':service, 'number':labels['com.docker.compose.container-number'],
                      'container_id':identifier, 'image_ref':item['Config']['Image'], 'image_id':item['Image'],
                      'network_mode':item['HostConfig']['NetworkMode'], 'ipv4':address, 'health':'healthy'})
                  if service not in ('provider','proxy'): attest[service+'_container_id'] = identifier
                  if service != 'proxy': continue
                  number = labels['com.docker.compose.container-number']
                  assert number in (('1','2') if floor else ('1',))
                  assert item['Config']['Cmd'] == ['--config','/proof/config.yaml','--host','0.0.0.0','--port','4000','--num_workers','1','--telemetry','false']
                  binds = [mount for mount in item['Mounts'] if mount['Type'] == 'bind']
                  assert len(binds) == len({mount['Destination'] for mount in binds}) == len(mounted) + 2
                  assert {mount['Destination'] for mount in binds} == {*mounted, '/proof/config.yaml', '/proof-private'}
                  private_mount = next(m for m in item['Mounts'] if m['Destination'] == '/proof-private')
                  assert private_mount['Type'] == 'bind' and private_mount['RW'] is True
                  assert private_mount['Source'] == str(Path(os.environ['PROOF_PRIVATE_DIR']).resolve())
                  for target,source in {**mounted, '/proof/config.yaml':os.environ['PROOF_CONFIG_FILE']}.items():
                      mount = next(m for m in item['Mounts'] if m['Destination'] == target)
                      assert mount['Type'] == 'bind' and mount['RW'] is False and mount['Source'] == str(Path(source).resolve())
                  execute = command + ['exec','-T','--index',number,'proxy','python','-B','-c']
                  actual = json.loads(read(execute + [code,*mounted]))
                  assert actual == {target:hashes[source] for target,source in mounted.items()}
                  assert json.loads(read(execute + [code,'/proof/config.yaml']))['/proof/config.yaml'] == config_hash
                  native_actual = json.loads(read(execute + [native_code,*native]))
                  assert native_actual == native
                  worker_files = {name:actual['/proof/'+name] for name in helpers}
                  assert worker_files == helpers
                  workers.append({'id':identifier, 'number':number, 'image_ref':item['Config']['Image'], 'image_id':item['Image'],
                      'health':'healthy', 'command':item['Config']['Cmd'], 'project':project, 'service':'proxy',
                      'network_mode':item['HostConfig']['NetworkMode'], 'private_mount':private_mount['Source'],
                      'config_sha256':config_hash, 'files_sha256':worker_files, 'native_sha256':native_actual, 'ipv4':address})
                  mounted_workers[number] = actual
          workers.sort(key=lambda worker:worker['number'])
          assert [worker['number'] for worker in workers] == (['1','2'] if floor else ['1'])
          assert len({worker['id'] for worker in workers}) == len(workers) and len({worker['ipv4'] for worker in workers}) == len(workers)
          assert len({worker['image_id'] for worker in workers}) == 1
          attest['proxy_container_id'] = workers[-1]['id']
          if floor:
              attest.update(private_mount=workers[-1]['private_mount'], workers=workers)
          info = read(command + ['exec','-T','redis','redis-cli','INFO','server'])
          attest['redis_run_id'] = next(line.split(':',1)[1] for line in info.splitlines() if line.startswith('run_id:'))
          assert re.fullmatch('[0-9a-f]{40}',attest['redis_run_id'])
          path = Path(os.environ['PROOF_PRIVATE_DIR'],'calendar-floor-attestation.private.json' if floor else 'calendar-attestation.private.json')
          with os.fdopen(os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600),'w',encoding='utf-8') as handle:
              json.dump(attest,handle)
          provider = json.loads(read(command + ['exec','-T','provider','python','-B','-c',code,'/proof/mock_provider.py']))
          assert provider['/proof/mock_provider.py'] == hashes['scripts/goal584-budget-proof/mock_provider.py']
          receipt = {'source_commit':rev, 'profile':profile, 'project':project, 'images':images, 'files_sha256':hashes,
                     'native_artifact':artifact,
                     'mounted_sha256':mounted_workers, 'provider_sha256':provider, 'private_config_sha256':config_hash,
                     'workers':[{key:value for key,value in worker.items() if key != 'private_mount'} for worker in workers],
                     'redis_run_id':attest['redis_run_id'], 'scope':'Dedicated native calendar job only; no WebUI or production'}
          Path(os.environ['PROOF_OUTPUT_DIR'],'runtime-identity.json').write_text(json.dumps(receipt,indent=2),encoding='utf-8')
          PY

      - name: Qualify the actual native monthly reset and immediate next call
        timeout-minutes: 5
        shell: bash
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          private, output = Path(os.environ['PROOF_PRIVATE_DIR']), Path(os.environ['PROOF_OUTPUT_DIR'])
          floor = os.environ['CALENDAR_PROFILE'] == 'positive-floor'
          prefix = 'calendar-floor' if floor else 'calendar'
          worker = '2' if floor else '1'
          command = ['docker','compose','-p',os.environ['CALENDAR_PROJECT'],'--env-file',os.environ['PROOF_ENV_FILE'],
                     '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.calendar-proof.yml']
          argv = command + ['exec','-T','--index',worker,'proxy','python','-B',
              '/proof/prove_calendar_floor.py' if floor else '/proof/prove_calendar_reset.py',
              '--project',os.environ['CALENDAR_PROJECT'],'--attestation','/proof-private/'+prefix+'-attestation.private.json',
              '--private-state','/proof-private/'+prefix+'-state.private.json','--receipt','/proof-private/'+prefix+'.safe.json']
          if floor:
              attest = json.loads((private/(prefix+'-attestation.private.json')).read_text(encoding='utf-8'))
              assert [item['number'] for item in attest['workers']] == ['1','2']
              argv += ['--peer-url','http://'+attest['workers'][0]['ipv4']+':4000']
          try:
              result = subprocess.run(argv,capture_output=True,text=True,timeout=240 if floor else 150)
              exit_code, stdout_size, stderr_size = result.returncode, len(result.stdout), len(result.stderr)
              # Never export arbitrary native stdout/stderr, even on import failure.
              result.stdout = result.stderr = ''
          except subprocess.TimeoutExpired:
              exit_code, stdout_size, stderr_size = -1, 0, 0
          secrets = [line.split('=',1)[1] for line in Path(os.environ['PROOF_ENV_FILE']).read_text().splitlines()
                     if line.split('=',1)[0] in ('PROOF_MASTER_KEY','PROOF_DB_PASSWORD','OWUI_BUDGET_GATEWAY_SECRET')]
          # Native write_private creates root-owned 0600 files. Keep permissions;
          # read through the owning container, retaining the raw key only in memory.
          handoff = '''import json
          import sys
          from pathlib import Path
          root=Path('/proof-private')
          prefix=sys.argv[1]
          assert prefix in ('calendar','calendar-floor')
          state=json.loads((root/(prefix+'-state.private.json')).read_text()) if (root/(prefix+'-state.private.json')).exists() else {}
          receipt=json.loads((root/(prefix+'.safe.json')).read_text()) if (root/(prefix+'.safe.json')).exists() else {'passed':False,'failure':'Native helper produced no receipt','outcome':'FAILED_BOUNDARY','failure_phase':'initialization'}
          print(json.dumps({'key':state.get('key'),'receipt':receipt}))'''
          transferred = subprocess.run(command+['exec','-T','--index',worker,'proxy','python','-B','-c',handoff,prefix],capture_output=True,text=True,timeout=15)
          assert transferred.returncode == 0 and len(transferred.stdout) <= 4*1024*1024, 'Native private handoff failed'
          value = json.loads(transferred.stdout)
          if value.get('key'): secrets.append(value.pop('key'))
          transferred.stdout = transferred.stderr = ''
          receipt = value['receipt']
          rendered = json.dumps(receipt,indent=2,allow_nan=False)
          assert not any(value and value in rendered for value in secrets)
          assert not re.search(r'sk-[A-Za-z0-9_-]+|eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+',rendered)
          assert str(private) not in rendered, 'Private host path in safe receipt'
          (output/(prefix+'.safe.json')).write_text(rendered,encoding='utf-8')
          diagnostic = {'profile':os.environ['CALENDAR_PROFILE'], 'helper_returncode':exit_code,
              'stdout_characters_discarded':stdout_size, 'stderr_characters_discarded':stderr_size,
              'outcome':receipt.get('outcome'), 'phase':receipt.get('failure_phase',receipt.get('phase')),
              'failure_leaf':receipt.get('failure_leaf'), 'passed':receipt.get('passed') is True}
          (output/'helper-diagnostic.txt').write_text(json.dumps(diagnostic,indent=2),encoding='utf-8')
          print(rendered)
          secrets.clear()
          del value, transferred
          assert exit_code == 0 and receipt.get('passed') is True, 'Native calendar qualification failed; inspect safe receipts'
          PY

      - name: Remove the calendar project and verify cleanup
        timeout-minutes: 3
        if: always()
        shell: bash
        run: |
          if test "${CALENDAR_PROJECT_CLAIMED:-false}" = true && test -n "${CALENDAR_PROJECT:-}" && test -f "$PROOF_ENV_FILE"; then
            python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          project = os.environ['CALENDAR_PROJECT']
          assert re.fullmatch(r'goal584-calendar-[0-9a-f]{12}',project)
          command = ['docker','compose','-p',project,'--env-file',os.environ['PROOF_ENV_FILE'],
                     '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.calendar-proof.yml']
          down_status = -1
          try:
              down_status = subprocess.run(command+['down','--volumes','--remove-orphans'],capture_output=True,timeout=120).returncode
          except (OSError,subprocess.TimeoutExpired):
              pass
          label = 'label=com.docker.compose.project='+project
          remaining = {kind:subprocess.check_output(command+['--filter',label],text=True).split() for kind,command in (
              ('containers',['docker','ps','-aq']),('volumes',['docker','volume','ls','-q']),('networks',['docker','network','ls','-q']))}
          Path(os.environ['PROOF_OUTPUT_DIR'],'cleanup.json').write_text(json.dumps({'project':project,
              'profile':os.environ['CALENDAR_PROFILE'], 'down_returncode':down_status, **remaining},indent=2),encoding='utf-8')
          assert down_status == 0 and not any(remaining.values()), 'Disposable calendar cleanup incomplete'
          PY
          fi

      - name: Retain only safe calendar evidence
        timeout-minutes: 2
        if: always() && env.PROOF_OUTPUT_DIR != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goal584-calendar-proof-${{ matrix.profile }}-${{ github.sha }}
          path: ${{ env.PROOF_OUTPUT_DIR }}
          if-no-files-found: warn
          retention-days: 7
