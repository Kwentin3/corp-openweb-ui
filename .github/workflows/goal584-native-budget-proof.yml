name: GOAL 584 native budget proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/goal584-native-budget-proof.yml
      - compose/goal584.native-budget-proof.yml
      - compose/goal584.webui-proof.yml
      - scripts/goal584-budget-proof/**
      - deploy/openwebui-budgets/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal584-native-budget-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-budget-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create isolated synthetic credentials
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'], 'goal584-native-budget-proof')
          output.mkdir()
          private = Path(os.environ['RUNNER_TEMP'], 'goal584-native-budget-private')
          private.mkdir(mode=0o700)
          config = private / 'config.yaml'
          config.write_bytes(Path('scripts/goal584-budget-proof/litellm_config.yaml').read_bytes())
          config.chmod(0o600)
          paths = {
              'PROOF_ENV_FILE': str(Path(os.environ['RUNNER_TEMP'], 'goal584-proof.env')),
              'PROOF_OUTPUT_DIR': str(output),
              'PROOF_RECEIPT': str(output / 'native-budgets.json'),
              'PROOF_PRIVATE_DIR': str(private),
              'PROOF_CONFIG_FILE': str(config),
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in paths.items():
                  handle.write(f'{key}={value}\n')
          values = {
              'PROOF_MASTER_KEY': 'sk-' + secrets.token_hex(32),
              'PROOF_DB_PASSWORD': secrets.token_hex(32),
              'OWUI_BUDGET_GATEWAY_SECRET': 'gw-' + secrets.token_hex(32),
              'WEBUI_SECRET_KEY': secrets.token_hex(32),
              'PROOF_PRIVATE_DIR': str(private),
              'PROOF_CONFIG_FILE': str(config),
          }
          fd = os.open(paths['PROOF_ENV_FILE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
                  if key in ('PROOF_MASTER_KEY', 'PROOF_DB_PASSWORD', 'OWUI_BUDGET_GATEWAY_SECRET', 'WEBUI_SECRET_KEY'):
                      print(f'::add-mask::{value}')
          PY

      - name: Start the pinned disposable backend
        shell: bash
        run: |
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml config --quiet
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml up -d --wait --wait-timeout 240

      - name: Bind the receipt to the actual images and source
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          command = ['docker', 'compose', '--env-file', os.environ['PROOF_ENV_FILE'], '-f', 'compose/goal584.native-budget-proof.yml']
          containers = subprocess.check_output(command + ['ps', '-q'], text=True).split()
          assert len(containers) == 4, 'Expected only the four disposable proof services'
          images = []
          for container in containers:
              data = json.loads(subprocess.check_output(['docker', 'inspect', container]))[0]
              images.append({
                  'service': data['Config']['Labels']['com.docker.compose.service'],
                  'image_ref': data['Config']['Image'],
                  'image_id': data['Image'],
                  'health': data['State'].get('Health', {}).get('Status'),
              })
              assert '@sha256:' in data['Config']['Image'], 'An unpinned image reached runtime'
          files = ['compose/goal584.native-budget-proof.yml', 'scripts/goal584-budget-proof/litellm_config.yaml',
                   'scripts/goal584-budget-proof/mock_provider.py', 'scripts/goal584-budget-proof/prove_native_budgets.py',
                   'deploy/openwebui-budgets/litellm_auth.py', 'deploy/openwebui-budgets/assignment.py',
                   'scripts/goal584-budget-proof/prove_gateway_auth.py']
          receipt = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'images': images,
              'files_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files},
              'scope': 'Disposable native LiteLLM core with a synthetic provider; no WebUI or key-selection adapter acceptance',
          }
          assert receipt['source_commit'] == os.environ['GITHUB_SHA']
          Path(os.environ['PROOF_OUTPUT_DIR'], 'runtime-identity.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY

      - name: Qualify native budgets against the synthetic provider
        shell: bash
        run: |
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T proxy python -B /proof/prove_native_budgets.py \
            --base-url http://127.0.0.1:4000 > "$PROOF_RECEIPT" || proof_result=$?
          cat "$PROOF_RECEIPT"
          exit "$proof_result"

      - name: Read the actual provider boundary
        if: always()
        shell: bash
        run: |
          if test -f "$PROOF_ENV_FILE" && test -n "$(docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml ps --status running -q provider)"; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
              exec -T provider python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/__proof/requests", timeout=3).read().decode())' \
              > "$PROOF_OUTPUT_DIR/provider-calls.json"
          fi

      - name: Compare the provider boundary to native outcomes
        shell: bash
        run: |
          python scripts/goal584-budget-proof/verify_provider_calls.py \
            "$PROOF_RECEIPT" "$PROOF_OUTPUT_DIR/provider-calls.json" \
            --receipt "$PROOF_OUTPUT_DIR/provider-boundary.json"

      - name: Bootstrap a native operator key before enabling the adapter
        shell: bash
        run: |
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T proxy python -B /proof/prove_gateway_auth.py --phase bootstrap \
            --base-url http://127.0.0.1:4000 --private-state /proof-private/gateway-state.private.json \
            --receipt /proof-private/bootstrap.safe.json > "$PROOF_OUTPUT_DIR/gateway-bootstrap.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/gateway-bootstrap.json"
          exit "$proof_result"

      - name: Enable the native hook through its config-file extension
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          config = Path(os.environ['PROOF_CONFIG_FILE'])
          content = config.read_text(encoding='utf-8')
          assert content.count('general_settings:\n') == 1 and 'custom_auth:' not in content
          content = content.replace('general_settings:\n', 'general_settings:\n  custom_auth: litellm_auth.gateway_auth\n  custom_auth_run_common_checks: true\n', 1)
          config.write_text(content, encoding='utf-8')
          receipt = {'custom_auth': 'litellm_auth.gateway_auth', 'custom_auth_run_common_checks': True,
                     'config_sha256': hashlib.sha256(config.read_bytes()).hexdigest()}
          Path(os.environ['PROOF_OUTPUT_DIR'], 'gateway-config.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml restart proxy
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml up -d --wait --wait-timeout 180
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T provider python -c 'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/__proof/reset", data=b"{}", headers={"Content-Type":"application/json"}), timeout=3).read()'

      - name: Qualify gateway identity selection and native management access
        shell: bash
        run: |
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T proxy python -B /proof/prove_gateway_auth.py --phase run \
            --base-url http://127.0.0.1:4000 --private-state /proof-private/gateway-state.private.json \
            --receipt /proof-private/gateway.safe.json > "$PROOF_OUTPUT_DIR/gateway-auth.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/gateway-auth.json"
          exit "$proof_result"

      - name: Verify persisted spend after a cold proxy and cache restart
        shell: bash
        run: |
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml restart redis proxy
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml up -d --wait --wait-timeout 180
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T proxy python -B /proof/prove_gateway_auth.py --phase restart \
            --base-url http://127.0.0.1:4000 --private-state /proof-private/gateway-state.private.json \
            --receipt /proof-private/restart.safe.json > "$PROOF_OUTPUT_DIR/gateway-restart.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/gateway-restart.json"
          exit "$proof_result"

      - name: Read the adapter provider boundary
        if: always()
        shell: bash
        run: |
          if test -f "$PROOF_ENV_FILE" && test -n "$(docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml ps --status running -q provider)"; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
              exec -T provider python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/__proof/requests", timeout=3).read().decode())' \
              > "$PROOF_OUTPUT_DIR/gateway-provider-calls.json"
          fi

      - name: Reject any extra provider dispatch from adapter checks
        shell: bash
        run: |
          python scripts/goal584-budget-proof/verify_provider_calls.py \
            "$PROOF_OUTPUT_DIR/gateway-auth.json" "$PROOF_OUTPUT_DIR/gateway-provider-calls.json" \
            --receipt "$PROOF_OUTPUT_DIR/gateway-provider-boundary.json"

      - name: Prepare the disposable browser driver
        shell: bash
        run: |
          command -v google-chrome
          google-chrome --version
          python -m venv "$RUNNER_TEMP/goal584-browser-venv"
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/goal584-budget-proof/browser-requirements.txt
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" -m pip check
          RUN_GOAL584_ADMIN_BROWSER=1 "$RUNNER_TEMP/goal584-browser-venv/bin/python" \
            -m unittest discover -s deploy/openwebui-budgets/tests -p test_admin_ui.py

      - name: Start stock WebUI with its native isolated data volume
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          config = Path(os.environ['PROOF_CONFIG_FILE'])
          content = config.read_text(encoding='utf-8')
          assert content.count('custom_auth: litellm_auth.gateway_auth') == 1
          assert 'missing_session_id:' not in content
          assert 'store_prompts_in_spend_logs:' not in content
          content = content.replace('general_settings:\n', 'general_settings:\n  missing_session_id: omit\n  store_prompts_in_spend_logs: false\n', 1)
          config.write_text(content.replace('custom_auth: litellm_auth.gateway_auth',
                                           'custom_auth: capture_webui_auth.gateway_auth'), encoding='utf-8')
          PY
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml config --quiet
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml up -d --wait --wait-timeout 240 webui
          python - <<'PY'
          import hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          command = ['docker', 'compose', '--env-file', os.environ['PROOF_ENV_FILE'],
                     '-f', 'compose/goal584.native-budget-proof.yml', '-f', 'compose/goal584.webui-proof.yml']
          container = subprocess.check_output(command + ['ps', '-q', 'webui'], text=True).strip()
          data = json.loads(subprocess.check_output(['docker', 'inspect', container]))[0]
          assert not data['HostConfig']['PortBindings'], 'WebUI proof must not publish a host port'
          network, = data['NetworkSettings']['Networks'].values()
          base = 'http://' + network['IPAddress'] + ':8080'
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}))
          with opener.open(base + '/api/version', timeout=10) as response:
              version = json.load(response)
          assert version.get('version') == '0.12.2'
          image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', data['Image']]))[0]
          revision = image['Config']['Labels']['org.opencontainers.image.revision']
          assert revision == '6a18585ff4c2e5f6805f682222cfbc46dc669ef8'
          assert data['State']['Health']['Status'] == 'healthy'
          files = ['compose/goal584.webui-proof.yml', 'scripts/goal584-budget-proof/provision_webui.py',
                   'scripts/goal584-budget-proof/prove_webui_browser.py', 'scripts/goal584-budget-proof/browser-requirements.txt',
                   'scripts/goal584-budget-proof/capture_webui_auth.py', 'scripts/goal584-budget-proof/provision_cost_display.py',
                   'deploy/openwebui-budgets/provenance.py', 'deploy/openwebui-budgets/cost_readback.py',
                   'deploy/openwebui-budgets/cost_filter.py', 'deploy/openwebui-budgets/cost_action.py',
                   'scripts/goal584-budget-proof/prove_cost_browser.py',
                   'scripts/goal584-budget-proof/provision_admin.py',
                   'scripts/goal584-budget-proof/prove_admin_browser.py',
                   'scripts/goal584-budget-proof/verify_admin_calls.py',
                   'deploy/openwebui-budgets/assignment.py', 'deploy/openwebui-budgets/admin_contract.py',
                   'deploy/openwebui-budgets/admin_client.py', 'deploy/openwebui-budgets/admin_policy.py',
                   'deploy/openwebui-budgets/admin_ui.py', 'deploy/openwebui-budgets/admin_tools.py',
                   'deploy/openwebui-budgets/webui_model_binding.py']
          receipt = {'source_commit': os.environ['GITHUB_SHA'], 'image_ref': data['Config']['Image'],
                     'image_id': data['Image'], 'upstream_revision': revision, 'version': version['version'],
                     'host_ports': [], 'health': 'healthy',
                     'diagnostic_custom_auth': 'capture_webui_auth.gateway_auth',
                     'product_auth_delegate': 'litellm_auth.gateway_auth',
                     'config_sha256': hashlib.sha256(Path(os.environ['PROOF_CONFIG_FILE']).read_bytes()).hexdigest(),
                     'files_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files}}
          Path(os.environ['PROOF_OUTPUT_DIR'], 'webui-runtime-identity.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write('PROOF_WEBUI_URL=' + base + '\n')
          PY

      - name: Verify mounted budget modules in the stock runtime
        shell: bash
        run: |
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T webui python -B -c \
            'import employee_budget_provenance as p, employee_budget_cost_readback as r; from importlib.metadata import version; assert p.__file__ == "/app/backend/employee_budget_provenance.py"; assert r.__file__ == "/app/backend/employee_budget_cost_readback.py"; print("native PyJWT:", version("PyJWT"))'
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T webui python -B -c \
            'import hashlib,importlib,json,pathlib; names=("assignment","admin_contract","admin_client","admin_policy","admin_ui","webui_model_binding"); modules=[importlib.import_module("employee_budget_"+name) for name in names]; assert all(module.__file__ == "/app/backend/employee_budget_"+name+".py" for name,module in zip(names,modules)); print(json.dumps({name:{"path":module.__file__,"sha256":hashlib.sha256(pathlib.Path(module.__file__).read_bytes()).hexdigest()} for name,module in zip(names,modules)}))' \
            > "$PROOF_OUTPUT_DIR/admin-mounted-modules.json"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          mounted = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'], 'admin-mounted-modules.json').read_text())
          for name, actual in mounted.items():
              expected = Path('deploy/openwebui-budgets', name + '.py')
              assert actual['sha256'] == hashlib.sha256(expected.read_bytes()).hexdigest(), name
          PY
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T webui python -B -m unittest discover -s /proof/budgets/tests

      - name: Provision two native employees and their model budgets
        shell: bash
        run: |
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T provider python -c \
            'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/__proof/reset", data=b"{}", headers={"Content-Type":"application/json"}), timeout=3).read()'
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -B /proof/provision_webui.py \
            --phase setup --private-state /proof-private/webui-state.private.json \
            --receipt /proof-private/webui-setup.safe.json > "$PROOF_OUTPUT_DIR/webui-setup.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/webui-setup.json"
          test "$proof_result" = 0
          umask 077
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -c \
            'import json; state=json.load(open("/proof-private/webui-state.private.json")); print(json.dumps({"users":[{key:user[key] for key in ("id","email","password")} for user in state["users"]]}))' \
            > "$PROOF_PRIVATE_DIR/browser-accounts.private.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          state = json.loads(Path(os.environ['PROOF_PRIVATE_DIR'], 'browser-accounts.private.json').read_text())
          for user in state['users']:
              print('::add-mask::' + user['password'])
          PY

      - name: Install the native signed-cost Filter and restricted reader
        shell: bash
        run: |
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -B /proof/provision_cost_display.py \
            --phase setup --private-state /proof-private/webui-state.private.json \
            --receipt /proof-private/cost-setup.safe.json > "$PROOF_OUTPUT_DIR/cost-setup.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/cost-setup.json"
          exit "$proof_result"

      - name: Qualify actual employee chats in the stock browser UI
        shell: bash
        run: |
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" scripts/goal584-budget-proof/prove_webui_browser.py \
            --base-url "$PROOF_WEBUI_URL" --accounts "$PROOF_PRIVATE_DIR/browser-accounts.private.json" \
            --env-file "$PROOF_ENV_FILE" --output "$PROOF_OUTPUT_DIR"

      - name: Prepare the native Tool and cost lifecycle fixture
        shell: bash
        run: |
          mkdir -p "$PROOF_OUTPUT_DIR/costs"
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -B /proof/provision_cost_display.py \
            --phase scenario --private-state /proof-private/webui-state.private.json \
            --receipt /proof-private/cost-scenario.safe.json > "$PROOF_OUTPUT_DIR/costs/scenario.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/costs/scenario.json"
          test "$proof_result" = 0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T provider python -c \
            'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/__proof/reset", data=b"{}", headers={"Content-Type":"application/json"}), timeout=3).read()'
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -c \
            'from pathlib import Path; Path("/proof-private/webui-gateway-context.private.json").write_text("{\"schema\":1,\"requests\":[]}", encoding="utf-8")'

      - name: Qualify cost details, tool rounds, regenerated spend and OFF budget denial
        shell: bash
        run: |
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" scripts/goal584-budget-proof/prove_cost_browser.py \
            --base-url "$PROOF_WEBUI_URL" --accounts "$PROOF_PRIVATE_DIR/browser-accounts.private.json" \
            --env-file "$PROOF_ENV_FILE" --output "$PROOF_OUTPUT_DIR/costs"

      - name: Install the native admin Tool and its private model preset
        shell: bash
        run: |
          mkdir -p "$PROOF_OUTPUT_DIR/admin"
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -B /proof/provision_admin.py \
            --phase setup --private-state /proof-private/webui-state.private.json \
            --browser-accounts /proof-private/admin-browser-accounts.private.json \
            --receipt /proof-private/admin-setup.safe.json > "$PROOF_OUTPUT_DIR/admin/setup.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/admin/setup.json"
          test "$proof_result" = 0
          # The proxy runs as root; keep its 0600 handoff private and project it
          # into a separate runner-owned 0600 file, as for the staff accounts.
          umask 077
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -c \
            'from pathlib import Path; print(Path("/proof-private/admin-browser-accounts.private.json").read_text(encoding="utf-8"))' \
            > "$PROOF_PRIVATE_DIR/admin-browser-accounts.for-browser.private.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          private = Path(os.environ['PROOF_PRIVATE_DIR'], 'admin-browser-accounts.for-browser.private.json')
          state = json.loads(private.read_text())
          print('::add-mask::' + state['admin']['password'])
          PY

      - name: Qualify native hash updates, zero-cap admission and owner role revocation
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          output = Path(os.environ['PROOF_OUTPUT_DIR'], 'admin')
          command = ['docker', 'compose', '--env-file', os.environ['PROOF_ENV_FILE'],
                     '-f', 'compose/goal584.native-budget-proof.yml', '-f', 'compose/goal584.webui-proof.yml']
          def provider_ids():
              result = subprocess.run(command + ['exec', '-T', 'provider', 'python', '-c',
                  'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/__proof/requests", timeout=3).read().decode())'],
                  capture_output=True, text=True, check=True, timeout=15)
              return [row['id'] for row in json.loads(result.stdout)['requests']]
          before = provider_ids()
          probe = subprocess.run(command + ['exec', '-T', 'proxy', 'python', '-B', '/proof/provision_admin.py',
              '--phase', 'native-probe', '--private-state', '/proof-private/webui-state.private.json',
              '--receipt', '/proof-private/admin-native-probe.safe.json'], capture_output=True, text=True, timeout=150)
          receipt = json.loads(probe.stdout)
          (output / 'native-probe.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          assert probe.returncode == 0 and receipt.get('passed') is True, receipt.get('failure', 'Native zero-cap probe failed')
          role = subprocess.run(command + ['exec', '-T', 'proxy', 'python', '-B', '/proof/provision_admin.py',
              '--phase', 'role-probe', '--private-state', '/proof-private/webui-state.private.json',
              '--receipt', '/proof-private/admin-role-probe.safe.json'], capture_output=True, text=True, timeout=150)
          role_receipt = json.loads(role.stdout)
          (output / 'role-probe.json').write_text(json.dumps(role_receipt, indent=2), encoding='utf-8')
          after = provider_ids()
          comparison = {'provider_ids_before': before, 'provider_ids_after': after, 'unchanged': before == after,
                        'native_zero_and_owner_role_probes': True}
          (output / 'native-probe-provider.json').write_text(json.dumps(comparison, indent=2), encoding='utf-8')
          assert role.returncode == 0 and role_receipt.get('passed') is True, role_receipt.get('failure', 'Native owner role probe failed')
          assert before == after, 'Native zero-cap or role probe dispatched to the provider'
          PY

      - name: Prepare an independent admin provider observation
        shell: bash
        run: |
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T provider python -c \
            'import urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/__proof/reset", data=b"{}", headers={"Content-Type":"application/json"}), timeout=3).read(); urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/__proof/control", data=b"{\"admin_mode\":true}", headers={"Content-Type":"application/json"}), timeout=3).read()'
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            -f compose/goal584.webui-proof.yml exec -T proxy python -c \
            'from pathlib import Path; Path("/proof-private/webui-gateway-context.private.json").write_text("{\"schema\":1,\"requests\":[]}", encoding="utf-8")'

      - name: Qualify admin Rich UI, exact JSON, confirmed caps and employee quotas
        shell: bash
        run: |
          "$RUNNER_TEMP/goal584-browser-venv/bin/python" scripts/goal584-budget-proof/prove_admin_browser.py \
            --base-url "$PROOF_WEBUI_URL" --admin-accounts "$PROOF_PRIVATE_DIR/admin-browser-accounts.for-browser.private.json" \
            --accounts "$PROOF_PRIVATE_DIR/browser-accounts.private.json" \
            --env-file "$PROOF_ENV_FILE" --output "$PROOF_OUTPUT_DIR/admin"

      - name: Reconcile admin model context, provider calls and native ledger
        shell: bash
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          output = Path(os.environ['PROOF_OUTPUT_DIR'], 'admin')
          browser = output / 'admin-browser.json'
          final = output / json.loads(browser.read_text())['final_native_receipt']
          assert final.resolve().parent == output.resolve()
          subprocess.run(['python', 'scripts/goal584-budget-proof/verify_admin_calls.py',
              '--browser', str(browser), '--provider', str(output / 'webui-provider-calls.json'),
              '--context', str(output / 'webui-gateway-context.json'), '--native', str(final),
              '--receipt', str(output / 'admin-boundary.json')], check=True)
          PY

      - name: Show bounded sanitized startup diagnostics on failure
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          env_file = Path(os.environ['PROOF_ENV_FILE'])
          if env_file.exists():
              command = ['docker', 'compose', '--env-file', str(env_file), '-f', 'compose/goal584.native-budget-proof.yml', '-f', 'compose/goal584.webui-proof.yml']
              result = subprocess.run(command + ['logs', '--no-color', '--tail', '80', 'proxy', 'webui'], capture_output=True, text=True)
              output = result.stdout + result.stderr
              for line in env_file.read_text(encoding='utf-8').splitlines():
                  output = output.replace(line.split('=', 1)[1], '[redacted]')
              output = re.sub(r'sk-[A-Za-z0-9_-]+', '[synthetic-key-redacted]', output)
              output = re.sub(r'postgresql://[^\s]+', '[database-url-redacted]', output)
              output = re.sub(r'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+', '[session-redacted]', output)
              print(output)
          PY

      - name: Remove the disposable backend and its data
        if: always()
        shell: bash
        run: |
          if test -f "$PROOF_ENV_FILE"; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
              -f compose/goal584.webui-proof.yml down --volumes --remove-orphans
            python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          label = 'label=com.docker.compose.project=goal584-native-budget-proof'
          containers = subprocess.check_output(['docker', 'ps', '-aq', '--filter', label], text=True).split()
          volumes = subprocess.check_output(['docker', 'volume', 'ls', '-q', '--filter', label], text=True).split()
          receipt = {'project': 'goal584-native-budget-proof', 'remaining_containers': containers, 'remaining_volumes': volumes}
          Path(os.environ['PROOF_OUTPUT_DIR'], 'cleanup.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          assert not containers and not volumes, 'Disposable proof resources remain'
          PY
          fi

      - name: Retain the synthetic qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goal584-native-budget-proof-${{ github.sha }}
          path: ${{ runner.temp }}/goal584-native-budget-proof/
          if-no-files-found: warn
          retention-days: 7
