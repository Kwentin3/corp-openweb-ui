name: GOAL 584 native budget proof

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/goal584-native-budget-proof.yml
      - compose/goal584.native-budget-proof.yml
      - compose/goal584.webui-proof.yml
      - compose/goal584.overlap-proof.yml
      - compose/goal584.calendar-proof.yml
      - compose/goal584.pricing-proof.yml
      - scripts/goal584-budget-proof/**
      - deploy/openwebui-budgets/**
      - deploy/litellm-patches/positive-floor-v1.105.1/**
  workflow_dispatch:
    inputs:
      acceptance:
        description: Existing full acceptance or one finite component/product case
        type: choice
        default: full
        options: [full, stream-usage, release-config, stream-ledger, file-service, monthly-api, gui-product]

permissions:
  contents: read

env:
  # Explicit stand-only candidate; provider and WebUI retain their stock images.
  PROOF_NATIVE_VARIANT: positive-floor-v1.105.1

concurrency:
  group: goal584-native-budget-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-budget-proof:
    runs-on: ubuntu-24.04
    env:
      ACCEPTANCE_PROFILE: ${{ inputs.acceptance || 'full' }}
      STREAM_COMPONENT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.acceptance != 'full' }}
      PROOF_NATIVE_VARIANT: ${{ github.event_name == 'workflow_dispatch' && (inputs.acceptance == 'stream-usage' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')) && 'stream-usage-v1.105.1' || 'positive-floor-v1.105.1' }}
    # Observed main runtime leaves room for the bounded provider500 phase.
    timeout-minutes: ${{ inputs.acceptance == 'release-config' && 5 || (inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')) && 25 || github.event_name == 'workflow_dispatch' && inputs.acceptance == 'stream-usage' && 20 || 85 }}
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create isolated synthetic credentials
        shell: bash
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP'], 'goal584-native-budget-proof')
          output.mkdir()
          private = Path(os.environ['RUNNER_TEMP'], 'goal584-native-budget-private')
          private.mkdir(mode=0o700)
          config = private / 'config.yaml'
          config.write_bytes(Path('scripts/goal584-budget-proof/litellm_config.yaml').read_bytes())
          if os.environ['ACCEPTANCE_PROFILE'] == 'gui-product':
              # Reuse the existing synthetic public catalog; no paid/external inference.
              content = config.read_text(encoding='utf-8')
              assert content.count('      input_cost_per_token: 0.01\n') == 2
              assert content.count('      output_cost_per_token: 0.02\n') == 2
              content = content.replace('      input_cost_per_token: 0.01\n', '').replace('      output_cost_per_token: 0.02\n', '')
              for route in ('a', 'b'):
                  old = '      id: goal584-deployment-' + route
                  assert content.count(old) == 1
                  content = content.replace(old, old + '\n      owui_billing_account_id: synthetic-provider\n      owui_billing_account_label: Test provider\n      owui_billing_immutable_deployment_id: true')
              config.write_text(content, encoding='utf-8')
          config.chmod(0o600)
          paths = {
              'PROOF_ENV_FILE': str(Path(os.environ['RUNNER_TEMP'], 'goal584-proof.env')),
              'PROOF_OUTPUT_DIR': str(output),
              'PROOF_RECEIPT': str(output / 'native-budgets.json'),
              'PROOF_PRIVATE_DIR': str(private),
              'PROOF_CONFIG_FILE': str(config),
          }
          if os.environ['PROOF_NATIVE_VARIANT']=='stream-usage-v1.105.1':
              proxy_env=private/'proxy-budget.env'
              proxy_env.write_text('PYTHONPATH=/proof\nTIKTOKEN_CACHE_DIR=/proof-private/native-tokenizers\nCUSTOM_TIKTOKEN_CACHE_DIR=/proof-private/native-tokenizers\n')
              proxy_env.chmod(0o600);paths['PROOF_PROXY_ENV_FILE']=str(proxy_env)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              for key, value in paths.items():
                  handle.write(f'{key}={value}\n')
          values = {
              'PROOF_MASTER_KEY': 'sk-' + secrets.token_hex(32),
              'PROOF_DB_PASSWORD': secrets.token_hex(32),
              'OWUI_BUDGET_GATEWAY_SECRET': 'gw-' + secrets.token_hex(32),
              'WEBUI_SECRET_KEY': secrets.token_hex(32),
              'PROOF_PRIVATE_DIR': str(private),
              'PROOF_CONFIG_FILE': str(config),
          }
          if os.environ['ACCEPTANCE_PROFILE'] == 'gui-product':
              values.update(PROOF_CATALOG_ENABLED='true', PROOF_LOCAL_COST_MAP='False',
                            PROOF_COST_MAP_URL='http://provider:8000/__proof/catalog')
          fd = os.open(paths['PROOF_ENV_FILE'], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={value}\n')
                  if key in ('PROOF_MASTER_KEY', 'PROOF_DB_PASSWORD', 'OWUI_BUDGET_GATEWAY_SECRET', 'WEBUI_SECRET_KEY'):
                      print(f'::add-mask::{value}')
          PY

      - name: Read the native release Compose configuration
        if: inputs.acceptance == 'release-config'
        timeout-minutes: 2
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,tempfile
          from pathlib import Path
          repo=Path.cwd();work=Path(tempfile.mkdtemp(prefix='goal584-release-config-',dir=os.environ['RUNNER_TEMP']))
          for name in ('webui','stt','terminal','google','budget'):
              (work/(name+'.env')).write_text('RELEASE_ONLY=release\nMERGE_ORDER=release\n' if name=='google'
                  else 'BUDGET_ONLY=budget\nMERGE_ORDER=budget\n' if name=='budget' else 'SYNTHETIC_ONLY=1\n')
          for name in ('google','budget'):(work/(name+'.yaml')).write_text('model_list: []\n')
          values={'RELEASE_WEBUI_IMAGE':'sha256:'+'1'*64,'RELEASE_WEBUI_NO_PROXY':'synthetic.invalid',
              'RELEASE_STT_NO_PROXY':'synthetic.invalid','EMPLOYEE_BUDGET_LITELLM_IMAGE':'sha256:'+'2'*64,
              'EMPLOYEE_BUDGET_MODULES_DIR':str(repo/'deploy/openwebui-budgets')}
          for prefix,name in (('RELEASE_WEBUI','webui'),('RELEASE_STT','stt'),('RELEASE_TERMINAL','terminal'),
                              ('RELEASE_GOOGLE','google'),('EMPLOYEE_BUDGET','budget')):
              values[prefix+'_ENV_FILE']=str(work/(name+'.env'))
          values.update(RELEASE_GOOGLE_CONFIG_FILE=str(work/'google.yaml'),EMPLOYEE_BUDGET_CONFIG_FILE=str(work/'budget.yaml'))
          env={key:os.environ[key] for key in ('PATH','HOME','DOCKER_HOST') if key in os.environ};env.update(values)
          interpolation=work/'compose.env';interpolation.write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          files=[repo/'compose'/name for name in ('openwebui.release-0122.compose.yml',
              'openwebui.release-0122.google.compose.yml','openwebui.employee-budgets.compose.yml')]
          def native(selected):
              cmd=['timeout','--signal=TERM','--kill-after=3s','20s','docker','compose','--env-file',str(interpolation)]
              for path in selected:cmd+=['-f',str(path)]
              return json.loads(subprocess.check_output(cmd+['config','--format','json'],env=env,text=True))
          baseline=native(files[:2]);merged=native(files)
          assert set(baseline['services'])==set(merged['services'])
          assert baseline.get('volumes')==merged.get('volumes') and baseline.get('networks')==merged.get('networks')
          for name,before in baseline['services'].items():
              allowed={'image','working_dir','environment','volumes'} if name=='google-gateway-0122' else {'volumes'} if name=='openwebui-0122' else set()
              assert {k:v for k,v in before.items() if k not in allowed}=={k:v for k,v in merged['services'][name].items() if k not in allowed}
          gateway=merged['services']['google-gateway-0122'];ui=merged['services']['openwebui-0122']
          assert gateway['image']==values['EMPLOYEE_BUDGET_LITELLM_IMAGE'] and gateway['working_dir']=='/app'
          assert all(gateway['environment'].get(k)==v for k,v in {'RELEASE_ONLY':'release','BUDGET_ONLY':'budget',
              'MERGE_ORDER':'budget','OWUI_BUDGET_REQUIRE_PROVENANCE':'true'}.items())
          assert all(gateway['environment'].get(k)==v for k,v in baseline['services']['google-gateway-0122']['environment'].items() if k!='MERGE_ORDER')
          mounts={m['target']:m for m in gateway['volumes']};assert len(mounts)==10
          assert mounts['/app/config.yaml']['source']==str(work/'budget.yaml')
          old={m['target']:m for m in baseline['services']['openwebui-0122']['volumes']};new={m['target']:m for m in ui['volumes']}
          assert old=={k:new[k] for k in old} and len(new)==len(old)+8
          additions=[m for m in gateway['volumes'] if m['target']!='/app/config.yaml']+[m for k,m in new.items() if k not in old]
          # Compose's canonical JSON omits false create_host_path (Go zero value).
          assert len(additions)==17 and all(m['type']=='bind' and m['read_only'] and m.get('bind',{}).get('create_host_path',False) is False and Path(m['source']).is_file() for m in additions)
          packet={'passed':True,'scope':'Native Compose merge only; synthetic inputs, no build/services/model calls',
              'source_commit':os.environ['GITHUB_SHA'],'compose_version':subprocess.check_output(['docker','compose','version','--short'],text=True).strip(),
              'source_sha256':{str(p.relative_to(repo)):hashlib.sha256(p.read_bytes()).hexdigest() for p in files},
              'services':sorted(merged['services']),'module_binds':{m['target']:{'source':Path(m['source']).name,
                  'sha256':hashlib.sha256(Path(m['source']).read_bytes()).hexdigest()} for m in additions},
              'data_networks_limits_security_preserved':True,'env_files_appended_and_overridden':True,'config_target_replaced':True}
          Path(os.environ['PROOF_OUTPUT_DIR'],'release-config.safe.json').write_text(json.dumps(packet,indent=2)+'\n')
          print(json.dumps(packet,indent=2))
          PY

      - name: Build the reviewed two-function native derivative
        if: inputs.acceptance != 'release-config'
        env:
          GOAL584_NATIVE_BUILD_OWNER: ${{ env.STREAM_COMPONENT_ONLY == 'true' && format('goal584-stream-{0}-{1}', github.run_id, github.run_attempt) || '' }}
        timeout-minutes: 10
        shell: bash
        run: |
          if test "$STREAM_COMPONENT_ONLY" = true; then
            python -B - <<'PY'
          import os
          disk=os.statvfs(os.environ['RUNNER_TEMP']);free=disk.f_bavail*disk.f_frsize
          memory=int(next(line.split()[1] for line in open('/proc/meminfo') if line.startswith('MemAvailable:')))*1024
          print({'available_disk_bytes':free,'available_memory_bytes':memory})
          assert free >= 8*1024**3 and memory >= 3*1024**3,'Native component resource bound not met'
          PY
          fi
          python -m venv "$RUNNER_TEMP/goal584-native-patch-venv"
          "$RUNNER_TEMP/goal584-native-patch-venv/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/goal584-budget-proof/native-patch-requirements.txt
          "$RUNNER_TEMP/goal584-native-patch-venv/bin/python" scripts/goal584-budget-proof/build_native_floor_image.py \
            --context "$RUNNER_TEMP/goal584-native-floor-build" --receipt "$PROOF_OUTPUT_DIR/native-build.json" \
            --variant "$PROOF_NATIVE_VARIANT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          receipt = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'],'native-build.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as handle:
              handle.write('PROOF_LITELLM_IMAGE='+receipt['image_ref']+'\n')
          PY

      - name: Prepare or qualify only the selected native component
        if: inputs.acceptance == 'stream-usage' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')
        timeout-minutes: 4
        shell: bash
        run: |
          python -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'deploy/litellm-patches/positive-floor-v1.105.1')
          import native_floor_identity as native
          out=Path(os.environ['PROOF_OUTPUT_DIR']);build=json.loads((out/'native-build.json').read_text())
          identity=native.verify_build(build);image=build['image_ref']
          owner='goal584-stream-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          ledger=os.environ.get('ACCEPTANCE_PROFILE') in ('stream-ledger','file-service','monthly-api','gui-product')
          cache=Path(os.environ['PROOF_PRIVATE_DIR'],'native-tokenizers') if ledger else Path(os.environ['RUNNER_TEMP'],'goal584-stream-tokenizers')
          cache.mkdir(mode=0o700)
          common=['docker','run','--rm','--init','--label','goal584.owner='+owner,
              '--read-only','--memory=2g','--cpus=2','--pids-limit=256',
              '--tmpfs','/tmp:rw,noexec,nosuid,size=128m','--entrypoint','python',
              '-e','LITELLM_LOCAL_MODEL_COST_MAP=True','-e','LITELLM_TELEMETRY=False',
              '-e','DO_NOT_TRACK=1','-e','PYTHONDONTWRITEBYTECODE=1','-e','TIKTOKEN_CACHE_DIR=/native-tokenizers']
          # Native tokenizer owner downloads its public hash-checked assets; no model call.
          subprocess.run(common+['--name',owner+'-cache','--mount','type=bind,source='+str(cache)+',target=/native-tokenizers',
              image,'-B','-c',"import tiktoken;[tiktoken.get_encoding(n) for n in ('cl100k_base','o200k_base')]"],
              check=True,timeout=75,stdout=subprocess.DEVNULL)
          if ledger:
              (out/'stream-tokenizers.safe.json').write_text(json.dumps({'passed':True,'model_calls':0,
                  'sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in cache.iterdir() if p.is_file()}},indent=2)+'\n')
              raise SystemExit(0)
          # Legacy Responses/nonstream controls passed on this same frozen native variant in run42804096354.
          tests=['test_unknown_usage_guard.CCStreamNativeProxyTests']
          packet={'scope':'Pinned-image native component; fixture auth/admin HTTP leaves, no real DB/UI acceptance',
              'source_commit':os.environ['GITHUB_SHA'],'native_artifact':identity,'tests':tests,'passed':False,
              'tokenizer_sha256':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in cache.iterdir() if p.is_file()}}
          save=lambda:(out/'stream-component.safe.json').write_text(json.dumps(packet,indent=2)+'\n')
          save()
          with (out/'stream-component.log').open('wb') as log:
              result=subprocess.run(common+['--name',owner+'-component','--network=none',
                  '--mount','type=bind,source='+str(Path.cwd())+',target=/repo,readonly',
                  '--mount','type=bind,source='+str(cache)+',target=/native-tokenizers,readonly',
                  '-w','/repo/scripts/goal584-budget-proof','-e','GOAL584_REQUIRE_BUFFERED_NATIVE_COMPONENT=1',
                  '-e','PROOF_NATIVE_VARIANT='+os.environ['PROOF_NATIVE_VARIANT'],
                  '-e','PROOF_LITELLM_IMAGE='+image,image,'-B','-m','unittest',*tests,'-v'],
                  stdout=log,stderr=subprocess.STDOUT,timeout=135)
          packet.update(passed=result.returncode==0,returncode=result.returncode);save()
          assert result.returncode==0,'Selected native stream component failed'
          PY

      - name: Start the pinned disposable backend
        if: env.STREAM_COMPONENT_ONLY != 'true' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')
        timeout-minutes: 6
        shell: bash
        run: |
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml config --quiet
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml up -d --wait --wait-timeout 240

      - name: Bind the receipt to the actual images and source
        if: env.STREAM_COMPONENT_ONLY != 'true' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')
        timeout-minutes: 3
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0,'deploy/litellm-patches/positive-floor-v1.105.1')
          import native_floor_identity as native_sdk
          build = json.loads(Path(os.environ['PROOF_OUTPUT_DIR'],'native-build.json').read_text())
          artifact = native_sdk.verify_build(build)
          command = ['docker', 'compose', '--env-file', os.environ['PROOF_ENV_FILE'], '-f', 'compose/goal584.native-budget-proof.yml']
          containers = subprocess.check_output(command + ['ps', '-q'], text=True).split()
          assert len(containers) == 4, 'Expected only the four disposable proof services'
          images = []
          for container in containers:
              data = json.loads(subprocess.check_output(['docker', 'inspect', container]))[0]
              images.append({
                  'service': data['Config']['Labels']['com.docker.compose.service'],
                  'image_ref': data['Config']['Image'],
                  'image_id': data['Image'],
                  'health': data['State'].get('Health', {}).get('Status'),
              })
              if data['Config']['Labels']['com.docker.compose.service'] == 'proxy':
                  assert data['Config']['Image'] == data['Image'] == native_sdk.image_ref()
              else:
                  assert '@sha256:' in data['Config']['Image'], 'An unpinned image reached runtime'
          native_code = "import json,sys;sys.path.insert(0,'/proof');import native_floor_identity as n;print(json.dumps(n.inspect_sources()))"
          native_actual = json.loads(subprocess.check_output(command + ['exec','-T','proxy','python','-B','-c',native_code]))
          assert native_actual['native_artifact'] == artifact
          files = ['compose/goal584.native-budget-proof.yml', 'scripts/goal584-budget-proof/litellm_config.yaml',
                   'compose/goal584.overlap-proof.yml', 'scripts/goal584-budget-proof/prove_budget_overlap.py',
                   'scripts/goal584-budget-proof/prove_failure_recovery.py',
                   'scripts/goal584-budget-proof/test_failure_recovery.py',
                   'scripts/goal584-budget-proof/init_vector_database.sql',
                   'scripts/goal584-budget-proof/mock_provider.py', 'scripts/goal584-budget-proof/prove_native_budgets.py',
                   'deploy/openwebui-budgets/litellm_auth.py', 'deploy/openwebui-budgets/assignment.py',
                   'deploy/openwebui-budgets/budget_errors.py',
                   'deploy/openwebui-budgets/pricing_snapshot.py',
                   'scripts/goal584-budget-proof/prove_pricing_snapshots.py',
                   'scripts/goal584-budget-proof/prove_gateway_auth.py',
                   'scripts/goal584-budget-proof/native-patch-requirements.txt',
                   *build['files_sha256']]
          if os.environ['ACCEPTANCE_PROFILE'] in ('stream-ledger','file-service','monthly-api','gui-product'):
              files += ['deploy/openwebui-budgets/'+name for name in ('unknown_usage_guard.py','budget_runtime.py',
                  'provenance.py','admin_client.py','admin_contract.py','cost_readback.py')]
          if os.environ['ACCEPTANCE_PROFILE'] in ('monthly-api','gui-product'):
              files += ['compose/goal584.webui-proof.yml','scripts/goal584-budget-proof/prove_monthly_api.py',
                  *['deploy/openwebui-budgets/'+name for name in ('monthly_view.py','admin_policy.py','admin_tools.py','cost_filter.py')]]
          receipt = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'images': images,
              'native_sdk': native_actual,
              'files_sha256': {name: hashlib.sha256(Path(name).read_bytes()).hexdigest() for name in files},
              'scope': 'Disposable native LiteLLM core with a synthetic provider; no WebUI or key-selection adapter acceptance',
          }
          assert receipt['source_commit'] == os.environ['GITHUB_SHA']
          vector_db = subprocess.check_output(command + ['exec', '-T', 'postgres', 'psql', '-U', 'goal584',
              '-d', 'goal584_vectors', '-tA', '-c',
              "SELECT current_database() || ':' || default_version FROM pg_available_extensions WHERE name = 'vector'"], text=True).strip()
          assert vector_db == 'goal584_vectors:0.8.7', 'Native vector database prerequisite unavailable'
          receipt['vector_prerequisite'] = {'database': 'goal584_vectors', 'available_extension': '0.8.7',
              'scope': 'Empty separate database and installed extension package; embedding flow not yet exercised'}
          Path(os.environ['PROOF_OUTPUT_DIR'], 'runtime-identity.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          PY

      - name: Qualify native budgets against the synthetic provider
        if: env.STREAM_COMPONENT_ONLY != 'true'
        shell: bash
        run: |
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T proxy python -B /proof/prove_native_budgets.py \
            --base-url http://127.0.0.1:4000 > "$PROOF_RECEIPT" || proof_result=$?
          cat "$PROOF_RECEIPT"
          exit "$proof_result"

      - name: Read the actual provider boundary
        if: (always()) && env.STREAM_COMPONENT_ONLY != 'true'
        shell: bash
        run: |
          if test -f "$PROOF_ENV_FILE" && test -n "$(docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml ps --status running -q provider)"; then
            docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
              exec -T provider python -c 'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8000/__proof/requests", timeout=3).read().decode())' \
              > "$PROOF_OUTPUT_DIR/provider-calls.json"
          fi

      - name: Compare the provider boundary to native outcomes
        if: env.STREAM_COMPONENT_ONLY != 'true'
        shell: bash
        run: |
          python scripts/goal584-budget-proof/verify_provider_calls.py \
            "$PROOF_RECEIPT" "$PROOF_OUTPUT_DIR/provider-calls.json" \
            --receipt "$PROOF_OUTPUT_DIR/provider-boundary.json"

      - name: Bootstrap a native operator key before enabling the adapter
        if: env.STREAM_COMPONENT_ONLY != 'true' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')
        timeout-minutes: 2
        shell: bash
        run: |
          proof_result=0
          docker compose --env-file "$PROOF_ENV_FILE" -f compose/goal584.native-budget-proof.yml \
            exec -T proxy python -B /proof/prove_gateway_auth.py --phase bootstrap \
            --base-url http://127.0.0.1:4000 --private-state /proof-private/gateway-state.private.json \
            --receipt /proof-private/bootstrap.safe.json > "$PROOF_OUTPUT_DIR/gateway-bootstrap.json" || proof_result=$?
          cat "$PROOF_OUTPUT_DIR/gateway-bootstrap.json"
          exit "$proof_result"

      - name: Enable the native hook through its config-file extension
        if: env.STREAM_COMPONENT_ONLY != 'true' || inputs.acceptance == 'stream-ledger' || inputs.acceptance == 'file-service' || (inputs.acceptance == 'monthly-api' || inputs.acceptance == 'gui-product')
        timeout-minutes: 5
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          config = Path(os.environ['PROOF_CONFIG_FILE'])
