name: GOAL584 Office build proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/goal584-office-proof.yml
      - scripts/goal584-budget-proof/build_office_profile.py
      - scripts/goal584-budget-proof/**
      - compose/goal584.native-budget-proof.yml
      - compose/goal584.webui-proof.yml
      - compose/goal584.office-proof.yml
      - deploy/openwebui-budgets/**
      - deploy/openwebui-functions/officecli_auto_attach_filter.py
      - deploy/litellm-patches/positive-floor-v1.105.1/**
      - deploy/openwebui-upgrade-0122/**
      - deploy/openwebui-patches/media-upload-v0.12.2/**
      - deploy/openwebui-patches/tool-context-v0.12.2/**
      - deploy/openwebui-patches/provider-context-v0.12.2/**
      - services/officecli-openapi-proof/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  office-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      OWNED: goal584-office-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Prepare fresh task output
        timeout-minutes: 1
        run: |
          BUILD_ROOT="$RUNNER_TEMP/$OWNED-build"; OUTPUT="$RUNNER_TEMP/$OWNED-output"
          printf '%s\n' "BUILD_ROOT=$BUILD_ROOT" "OUTPUT=$OUTPUT" "DOCKER_CONFIG=$BUILD_ROOT/docker-config" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$BUILD_ROOT" && test ! -e "$OUTPUT"
          mkdir -m 700 "$OUTPUT"
          echo 'TASK_PREPARED=true' >> "$GITHUB_ENV"
      - name: Build existing frontend, runtime and Office owners
        timeout-minutes: 45
        run: |
          python3 -B scripts/goal584-budget-proof/build_office_profile.py \
            --work-root "$BUILD_ROOT" --receipt "$BUILD_ROOT/office-build.safe.json" 2>&1 | tee "$OUTPUT/build-driver.log"
      - name: Qualify the real CLI with the existing local-file preflight
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT']);out=Path(os.environ['OUTPUT'])
          receipt=json.loads((root/'office-build.safe.json').read_text());office=receipt['images']['office'];observation=receipt['office']
          assert receipt['source_commit']==os.environ['GITHUB_SHA'] and receipt['native_office_accepted'] is False
          assert re.fullmatch('sha256:[0-9a-f]{64}',office['id']) and re.fullmatch('[0-9a-f]{64}',receipt['build_identity'])
          assert re.fullmatch('goal584-office-office:[0-9a-f]{12}-[0-9a-f]{12}',office['tag'])
          inspect=lambda:subprocess.check_output(['docker','image','inspect',office['tag'],'--format','{{.Id}}'],text=True).strip()
          assert inspect()==office['id']
          source=root/'source';dockerfile=source/'services/officecli-openapi-proof/tests/Dockerfile'
          test=source/'services/officecli-openapi-proof/tests/verify_capability_discovery.py'
          evidence={'schema':1,'office_image_id':office['id'],'dockerfile_sha256':hashlib.sha256(dockerfile.read_bytes()).hexdigest(),'test_sha256':hashlib.sha256(test.read_bytes()).hexdigest(),'stage':'qualification_build','preflight_passed':False,'native_office_accepted':False}
          save=lambda:(out/'qualification.safe.json').write_text(json.dumps(evidence,indent=2)+'\n')
          save()
          tag='goal584-office-qualification:'+receipt['build_identity'];iid=out/'qualification.iid'
          with (out/'qualification-build.log').open('wb') as log:
              subprocess.run(['docker','build','--platform=linux/amd64','--iidfile',str(iid),'-f',str(dockerfile),'--build-arg','OFFICECLI_IMAGE='+office['tag'],'-t',tag,str(source)],stdout=log,stderr=subprocess.STDOUT,check=True)
          assert inspect()==office['id'];image=iid.read_text().strip();assert re.fullmatch('sha256:[0-9a-f]{64}',image)
          evidence.update(qualification_image_id=image,stage='qualification_readback');save()
          readback="import hashlib,importlib.metadata,json,pathlib; r=pathlib.Path('/app/officecli_openapi_proof'); lock=pathlib.Path('/app/requirements.lock'); versions={n:importlib.metadata.version(n) for n in ('openpyxl','pytest','aiohttp')}; print(json.dumps({'modules':{n:hashlib.sha256((r/n).read_bytes()).hexdigest() for n in "+repr(tuple(observation['modules']))+"},'binary_sha256':hashlib.sha256(pathlib.Path('/usr/local/bin/officecli').read_bytes()).hexdigest(),'lock_sha256':hashlib.sha256(lock.read_bytes()).hexdigest(),'production_lock_matches':all(importlib.metadata.version(n)==v for n,v in (line.split('==') for line in lock.read_text().splitlines() if line and not line.startswith('#'))),'test_dependencies':versions}))"
          common=['docker','run','--rm','--init','--network=none','--read-only','--memory=1g','--pids-limit=256','--tmpfs','/tmp:rw,noexec,nosuid,size=128m','--label','goal584.owner='+os.environ['OWNED']]
          actual=json.loads(subprocess.check_output(common+['--name',os.environ['OWNED']+'-readback','--entrypoint','python',image,'-B','-c',readback],text=True))
          evidence.update(readback=actual);save()
          assert actual['modules']==observation['modules'] and actual['binary_sha256']==observation['binary_sha256'] and actual['production_lock_matches']
          assert actual['lock_sha256']==hashlib.sha256((source/'services/officecli-openapi-proof/requirements.lock').read_bytes()).hexdigest()
          evidence.update(stage='preflight');save()
          target='DiscoveryQualification.test_saved_note_uses_the_same_real_cli_import_and_refuses_a_changed_source'
          with (out/'preflight.log').open('wb') as log:
              result=subprocess.run(common+['--name',os.environ['OWNED']+'-preflight','--mount','type=bind,source='+str(test)+',target=/tests/verify_capability_discovery.py,readonly','--entrypoint','python',image,'-B','/tests/verify_capability_discovery.py',target],stdout=log,stderr=subprocess.STDOUT)
          evidence.update(stage='complete',preflight_passed=result.returncode==0,returncode=result.returncode,test=target);save()
          assert result.returncode==0,'Existing real-CLI preflight failed'
          PY
      - name: Build the reviewed native derivative and prepare the host driver
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/$OWNED-driver"
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/goal584-budget-proof/native-patch-requirements.txt \
            -r scripts/goal584-budget-proof/browser-requirements.txt
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -m pip check
          command -v google-chrome
          google-chrome --version
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B scripts/goal584-budget-proof/build_native_floor_image.py \
            --context "$BUILD_ROOT/native-floor" --receipt "$OUTPUT/native-build.safe.json"
      - name: Prepare fresh private Office stand configuration
        timeout-minutes: 1
        run: |
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B - <<'PY'
          import json,os,re,secrets,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/goal584-budget-proof')
          from office_fixture import prepare_office_config,prepare_native_tokenizers
          private=Path(os.environ['RUNNER_TEMP'],os.environ['OWNED']+'-private');private.mkdir(mode=0o700)
          env_file=private/'compose.env';config=private/'config.yaml'
          raw=prepare_office_config(Path('scripts/goal584-budget-proof/litellm_config.yaml').read_bytes())
          def write(path,data):
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as handle:handle.write(data)
              assert path.read_bytes()==data
          write(config,raw)
          cache=private/'native-tokenizers';assets=prepare_native_tokenizers(cache)
          (Path(os.environ['OUTPUT'])/'tokenizers.safe.json').write_text(json.dumps(assets,indent=2)+'\n')
          build=json.loads((Path(os.environ['BUILD_ROOT'])/'office-build.safe.json').read_text())
          native=json.loads((Path(os.environ['OUTPUT'])/'native-build.safe.json').read_text())
          assert build['source_commit']==os.environ['GITHUB_SHA'] and build['native_office_accepted'] is False
          values={'PROOF_PRIVATE_DIR':str(private),'PROOF_CONFIG_FILE':str(config),'PROOF_OFFICE_TOKENIZER_CACHE':str(cache),
            'PROOF_NATIVE_VARIANT':'positive-floor-v1.105.1','PROOF_LITELLM_IMAGE':native['image_ref'],
            'PROOF_OFFICE_WEBUI_IMAGE':build['images']['webui']['id'],'PROOF_OFFICE_IMAGE':build['images']['office']['id']}
          assert all(re.fullmatch('sha256:[0-9a-f]{64}',values[key]) for key in
            ('PROOF_LITELLM_IMAGE','PROOF_OFFICE_WEBUI_IMAGE','PROOF_OFFICE_IMAGE'))
          for key,prefix in (('PROOF_MASTER_KEY','sk-'),('PROOF_DB_PASSWORD',''),
              ('OWUI_BUDGET_GATEWAY_SECRET','gw-'),('WEBUI_SECRET_KEY','')):
              values[key]=prefix+secrets.token_hex(32);print('::add-mask::'+values[key])
          write(env_file,''.join(key+'='+value+'\n' for key,value in values.items()).encode())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as handle:
              handle.write('PROOF_ENV_FILE='+str(env_file)+'\nPROOF_PRIVATE_DIR='+str(private)+'\nPROOF_CONFIG_FILE='+str(config)+'\n')
          PY
      - name: Start the isolated backend and enable the existing authentication hook
        timeout-minutes: 7
        run: |
          compose=(docker compose --project-name "$OWNED" --env-file "$PROOF_ENV_FILE" \
            -f compose/goal584.native-budget-proof.yml -f compose/goal584.webui-proof.yml -f compose/goal584.office-proof.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --wait --wait-timeout 240 postgres redis provider proxy
          "${compose[@]}" exec -T --user "$(id -u):$(id -g)" proxy python -B /proof/prove_gateway_auth.py --phase bootstrap \
            --base-url http://127.0.0.1:4000 --private-state /proof-private/gateway-state.private.json \
            --receipt /proof-private/bootstrap.safe.json > "$OUTPUT/gateway-bootstrap.safe.json"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['PROOF_CONFIG_FILE']);raw=path.read_bytes()
          marker=b'general_settings:\n'
          assert raw.count(marker)==1 and b'custom_auth:' not in raw and b'missing_session_id:' not in raw
          value=raw.replace(marker,marker+b'  custom_auth: capture_webui_auth.gateway_auth\n  custom_auth_run_common_checks: true\n  missing_session_id: omit\n',1)
          # Preserve the already-mounted file inode.
          with path.open('r+b') as handle:
              handle.write(value);handle.truncate();handle.flush();os.fsync(handle.fileno())
          assert path.read_bytes()==value
          PY
          "${compose[@]}" restart proxy
          "${compose[@]}" up -d --wait --wait-timeout 240
      - name: Prepare Office and verify one ordinary Send and native accounting
        timeout-minutes: 8
        run: |
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B - <<'PY'
          import base64,hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/goal584-budget-proof')
          from office_fixture import OfficeFixture
          from prove_gateway_auth import write_private
          from prove_native_budgets import ProofError
          from prove_pricing_browser import no_credentials
          from prove_pricing_snapshots import private_credentials
          private=Path(os.environ['PROOF_PRIVATE_DIR']);env_file=Path(os.environ['PROOF_ENV_FILE'])
          secrets=[line.partition('=')[2] for line in env_file.read_text().splitlines()
              if any(word in line.partition('=')[0] for word in ('KEY','SECRET','PASSWORD'))]
          fixture=OfficeFixture(env_file,Path(os.environ['OUTPUT']),Path(os.environ['PROOF_CONFIG_FILE']),private,secrets)
          fixture.command[2:2]=['--project-name',os.environ['OWNED']]
          container=subprocess.check_output(fixture.command+['ps','-q','webui'],text=True).strip()
          networks=json.loads(subprocess.check_output(['docker','inspect','--format','{{json .NetworkSettings.Networks}}',container]))
          network,=networks.values();base='http://'+network['IPAddress']+':8080'
          for script,label in (('provision_webui.py','webui'),('provision_cost_display.py','cost')):
              receipt=fixture.command_json(['exec','-T','--user',str(os.getuid())+':'+str(os.getgid()),'proxy','python','-B','/proof/'+script,'--phase','setup',
                  '--private-state','/proof-private/webui-state.private.json','--receipt','/proof-private/'+label+'-setup.safe.json'],label+'_setup',timeout=120)
              assert receipt.get('passed') is True
              (fixture.output/(label+'-setup.safe.json')).write_text(json.dumps(receipt,indent=2)+'\n')
          build=json.loads((Path(os.environ['BUILD_ROOT'])/'office-build.safe.json').read_text())
          stage='preparation';wire_diagnostic_collected=False
          def public(name,value):
              no_credentials(value,fixture.secrets)
              (fixture.output/(name+'.safe.json')).write_text(json.dumps(value,indent=2)+'\n')
          def readback(phase):
              # Collector uses proxy root: native capture and its lock are root0600.
              result=subprocess.run(fixture.command+['exec','-T','proxy','python','-B',
                  '/proof/prove_office_readback.py','--phase',phase],capture_output=True,timeout=100)
              assert len(result.stdout)<=2*1024*1024,'Office safe readback exceeded bound'
              packet=json.loads(result.stdout);public('office-'+phase,packet)
              assert result.returncode==0 and packet.get('passed') is True,'Office native readback failed'
              assert packet['source_sha256']==hashlib.sha256(Path('scripts/goal584-budget-proof/prove_office_readback.py').read_bytes()).hexdigest()
              return packet
          def artifacts():
              sys.path.insert(0,'services/officecli-openapi-proof')
              from prove_office_compatibility import _nodes,verify_artifacts
              call=next(item for item in primary[0]['response']['output'] if item['type']=='function_call')
              exported=json.loads(next(item['output'] for item in primary[1]['body']['input']
                  if item.get('type')=='function_call_output' and item['call_id']==call['call_id']))
              images=[item['image_url'] for item in _nodes(primary[2]['body']['input']) if item.get('type')=='input_image']
              assert len(images)==1 and images[0].startswith('data:image/png;base64,')
              png=base64.b64decode(images[0].partition(',')[2],validate=True)
              document=Path(raw['paths']['browser']).read_bytes()
              screenshot=Path(raw['paths']['screenshot']).read_bytes()
              assert all(0<len(data)<=8*1024*1024 for data in (document,png,screenshot))
              assert hashlib.sha256(document).hexdigest()==observed['docx_sha256']==exported['result_sha256']
              assert hashlib.sha256(screenshot).hexdigest()==observed['screenshot_sha256']
              # These are bounded files from this fresh synthetic SOURCE turn.
              # Preserve the actual evidence even if a content assertion fails.
              (fixture.output/'office.docx').write_bytes(document)
              (fixture.output/'office-render.png').write_bytes(png)
              (fixture.output/'office-browser.png').write_bytes(screenshot)
              return verify_artifacts(source_message_id=observed['source_message_id'],exported=exported,
                  native_file_id=observed['file_id'],browser_file_id=observed['file_id'],
                  native_path=raw['paths']['native'],browser_path=raw['paths']['browser'],png=png)
          try:
              ready=fixture.prepare(base,build,os.environ['GITHUB_SHA'])
              assert ready['status']=='prepared' and ready['native_office_accepted'] is False and ready['inference_issued'] is False
              public('office-preparation',ready)
              for name in ('webui-state.private.json','office-state.private.json'):
                  fixture.secrets.extend(private_credentials(fixture._office_private(name)[1]))
              stage='baseline';baseline=readback('baseline')
              stage='ordinary_send'
              from playwright.sync_api import sync_playwright
              from prove_office_browser import run
              with sync_playwright() as playwright:
                  browser=playwright.chromium.launch(channel='chrome',headless=True)
                  try: observed,raw=run(browser,fixture,base,build,os.environ['GITHUB_SHA'])
                  finally: browser.close()
              public('office-browser',observed)
              stage='native_context'
              provider=fixture.command_json(['exec','-T','provider','python','-B','-c',
                  'import urllib.request;print(urllib.request.urlopen("http://127.0.0.1:8000/__proof/requests",timeout=3).read().decode())'],'office_provider')
              primary=[row for row in provider['requests'] if row['body']['model']=='goal584-fake-office']
              assert len(primary)==3,'Office primary dispatch count differs'
              reasoning=[[item for item in row['response']['output'] if item['type']=='reasoning'] for row in primary]
              packet=fixture.native_context(base,build,os.environ['GITHUB_SHA'],reasoning)
              write_private(private/'office-native-context.private.json',packet)
              stage='wire_diagnostic';readback('diagnostic');wire_diagnostic_collected=True
              stage='native_finance';financial=readback('verify')
              stage='artifact'
              checked=artifacts()
              public('office-native',{'schema':1,'passed':True,'stage':'bounded_native_office',
                  'native_office_accepted':False,'browser_observed':True,'artifact':checked,'financial':financial,
                  'limits':['independent artifact review pending','no production or full GOAL acceptance',
                      'no complete saved reasoning continuity or live Filter pre/post claim']})
          except Exception as error:
              # Never print Playwright request diagnostics or raw private payloads.
              failure={'schema':1,'passed':False,'stage':stage,
                  'native_office_accepted':False,'error_class':type(error).__name__}
              if isinstance(error,(AssertionError,ProofError)) and len(str(error))<=1024:
                  try: no_credentials({'message':str(error)},fixture.secrets)
                  except (AssertionError,ProofError): pass
                  else: failure['failure']=str(error)
              # Observe unchanged synthetic wires before teardown; diagnostic
              # failure must never replace the original qualification failure.
              if not wire_diagnostic_collected:
                  try: readback('diagnostic');wire_diagnostic_collected=True
                  except Exception: pass
              failure['wire_diagnostic_collected']=wire_diagnostic_collected
              if stage!='artifact':
                  try: public('office-artifact',{'passed':True,'native_office_accepted':False,**artifacts()})
                  except Exception as artifact_error:
                      failure['artifact_diagnostic_collected']=False
                      failure['artifact_error_class']=type(artifact_error).__name__
                      if isinstance(artifact_error,ProofError) and str(artifact_error).startswith('office_') and str(artifact_error).isascii() and str(artifact_error).isidentifier():
                          failure['artifact_failure_code']=str(artifact_error)
                  else: failure['artifact_diagnostic_collected']=True
              public('office-native',failure)
              raise SystemExit(1)
          PY
      - name: Verify native key block and signed gateway denial
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B - <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/goal584-budget-proof')
          from prove_gateway_auth import read_private
          from prove_pricing_snapshots import no_credentials,private_credentials
          private=Path(os.environ['PROOF_PRIVATE_DIR']);out=Path(os.environ['OUTPUT'])
          assert json.loads((out/'office-native.safe.json').read_text()).get('passed') is True
          secrets=[line.partition('=')[2] for line in Path(os.environ['PROOF_ENV_FILE']).read_text().splitlines()
              if any(word in line.partition('=')[0] for word in ('KEY','SECRET','PASSWORD'))]
          secrets.extend(private_credentials(read_private(private/'gateway-state.private.json')))
          compose=['docker','compose','--project-name',os.environ['OWNED'],'--env-file',os.environ['PROOF_ENV_FILE'],
              '-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.webui-proof.yml','-f','compose/goal584.office-proof.yml']
          result=subprocess.run(compose+['exec','-T','--user',str(os.getuid())+':'+str(os.getgid()),'proxy',
              'python','-B','/proof/prove_native_key_block.py'],capture_output=True,timeout=150)
          assert 0<len(result.stdout)<=64*1024,'Native block receipt exceeded bound or is absent'
          packet=json.loads(result.stdout);no_credentials(packet,secrets)
          assert packet.get('schema')==1 and packet.get('proof')=='goal584-native-key-block'
          source=Path('scripts/goal584-budget-proof');budgets=Path('deploy/openwebui-budgets')
          owners={name:source/name for name in ('prove_native_key_block.py','provision_webui.py',
              'prove_gateway_auth.py','prove_native_budgets.py','prove_pricing_snapshots.py','prove_service_tasks.py')}
          owners.update({name:budgets/path for name,path in {
              'employee_budget_admin_client.py':'admin_client.py','employee_budget_admin_contract.py':'admin_contract.py',
              'employee_budget_assignment.py':'assignment.py','provenance.py':'provenance.py','litellm_auth.py':'litellm_auth.py'}.items()})
          expected={name:hashlib.sha256(path.read_bytes()).hexdigest() for name,path in owners.items()}
          assert packet.get('worker_sha256')==expected['prove_native_key_block.py'],'Native block worker source differs'
          assert packet.get('passed') is not True or packet.get('source_sha256')==expected,'Native block runtime owners differ'
          assert result.returncode==0 or packet.get('passed') is False,'Native block exit and receipt disagree'
          (out/'native-key-block.safe.json').write_text(json.dumps(packet,indent=2)+'\n')
          assert result.returncode==0 and packet.get('passed') is True,'Native key block/admission proof failed'
          assert packet.get('unknown_usage_policy_qualified') is False
          PY
      - name: Remove only task containers and actual image IDs
        if: always() && env.TASK_PREPARED == 'true'
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          import json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT']);out=Path(os.environ['OUTPUT']);out.mkdir(exist_ok=True)
          run=lambda args:subprocess.run(['docker',*args],stdout=subprocess.PIPE,stderr=subprocess.DEVNULL,text=True)
          containers=[os.environ['OWNED']+'-readback',os.environ['OWNED']+'-preflight'];images=[];invalid=[];frontend=None;inventory_failed=False
          # Compose owns its task-scoped containers, volumes and network.
          project=os.environ['OWNED'];assert re.fullmatch('goal584-office-[0-9]+-[0-9]+',project)
          env_file=os.environ.get('PROOF_ENV_FILE');down=None
          if env_file and Path(env_file).is_file():
              compose=['compose','--project-name',project,'--env-file',env_file,'-f','compose/goal584.native-budget-proof.yml','-f','compose/goal584.webui-proof.yml','-f','compose/goal584.office-proof.yml']
              down=run(compose+['down','--volumes','--remove-orphans','--timeout','20']).returncode
          residual={}
          for kind,args in {'containers':['ps','-aq'],'volumes':['volume','ls','-q'],'networks':['network','ls','-q']}.items():
              found=run(args+['--filter','label=com.docker.compose.project='+project])
              inventory_failed=inventory_failed or found.returncode!=0
              residual[kind]=found.stdout.splitlines()
          for path in [out/'qualification.iid',root/'webui.iid',root/'office.iid',root/'frontend.iid',root/'native-floor/image-id.txt']:
              if path.exists():
                  value=path.read_text().strip()
                  if re.fullmatch('sha256:[0-9a-f]{64}',value):
                      images.append(value)
                      if path.name=='frontend.iid':frontend=value
                  else:invalid.append(path.name)
          if frontend:
              found=run(['ps','-aq','--no-trunc','--filter','ancestor='+frontend]);inventory_failed=inventory_failed or found.returncode!=0
              for value in found.stdout.splitlines():
                  if re.fullmatch('[0-9a-f]{64}',value) and run(['inspect','--format','{{.Image}}',value]).stdout.strip()==frontend:containers.append(value)
                  else:inventory_failed=True
          removed_containers={value:run(['rm','-f',value]).returncode for value in containers}
          # Keep image evidence available if stand teardown is incomplete.
          teardown_ok=not inventory_failed and not any(residual.values()) and down in (None,0)
          removed_images={value:run(['image','rm','-f',value]).returncode for value in dict.fromkeys(images)} if teardown_ok else {}
          remaining_containers=[value for value in containers if run(['container','inspect',value]).returncode==0]
          remaining_images=[value for value in images if run(['image','inspect',value]).returncode==0]
          reachable=run(['info','--format','{{.ServerVersion}}']).returncode==0
          safe={'schema':1,'docker_reachable':reachable,'compose_down_returncode':down,'compose_remaining':residual,'container_remove_returncodes':removed_containers,'image_remove_returncodes':removed_images,'remaining_containers':remaining_containers,'remaining_images':remaining_images,'invalid_iid_files':invalid,'container_inventory_failed':inventory_failed,'build_cache_removed':False,'native_office_accepted':False}
          (out/'cleanup.safe.json').write_text(json.dumps(safe,indent=2)+'\n')
          assert reachable and teardown_ok and not remaining_containers and not remaining_images and not invalid,'Task cleanup incomplete'
          PY
