name: GOAL584 Office build proof
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/goal584-office-proof.yml
      - scripts/goal584-budget-proof/build_office_profile.py
      - scripts/goal584-budget-proof/**
      - compose/goal584.native-budget-proof.yml
      - compose/goal584.webui-proof.yml
      - compose/goal584.office-proof.yml
      - deploy/openwebui-budgets/**
      - deploy/openwebui-functions/officecli_auto_attach_filter.py
      - deploy/openwebui-tools/corporate_template_models.json
      - deploy/openwebui-tools/corporate_templates.py
      - deploy/openwebui-skills/artifact-workflow.md
      - deploy/litellm-patches/positive-floor-v1.105.1/**
      - deploy/openwebui-upgrade-0122/**
      - deploy/openwebui-patches/media-upload-v0.12.2/**
      - deploy/openwebui-patches/tool-context-v0.12.2/**
      - deploy/openwebui-patches/provider-context-v0.12.2/**
      - services/officecli-openapi-proof/**
  workflow_dispatch:
    inputs:
      acceptance:
        description: Finite acceptance profile
        type: choice
        default: office
        options: [office, known-zero, delegation-cost]
permissions:
  contents: read
jobs:
  office-build-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    env:
      OWNED: goal584-office-${{ github.run_id }}-${{ github.run_attempt }}
      ACCEPTANCE_PROFILE: ${{ inputs.acceptance || 'office' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 1
        with:
          persist-credentials: false
      - name: Prepare fresh task output
        timeout-minutes: 1
        run: |
          BUILD_ROOT="$RUNNER_TEMP/$OWNED-build"; OUTPUT="$RUNNER_TEMP/$OWNED-output"
          printf '%s\n' "BUILD_ROOT=$BUILD_ROOT" "OUTPUT=$OUTPUT" "DOCKER_CONFIG=$BUILD_ROOT/docker-config" >> "$GITHUB_ENV"
          printf 'PROOF_STARTED_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test ! -e "$BUILD_ROOT" && test ! -e "$OUTPUT"
          mkdir -m 700 "$OUTPUT"
          echo 'TASK_PREPARED=true' >> "$GITHUB_ENV"
      - name: Build existing frontend, runtime and Office owners
        timeout-minutes: 45
        run: |
          python3 -B scripts/goal584-budget-proof/build_office_profile.py \
            --work-root "$BUILD_ROOT" --receipt "$BUILD_ROOT/office-build.safe.json" 2>&1 | tee "$OUTPUT/build-driver.log"
      - name: Qualify the real CLI with the existing local-file preflight
        timeout-minutes: 3
        run: |
          python3 - <<'PY'
          import hashlib,json,os,re,subprocess
          from pathlib import Path
          root=Path(os.environ['BUILD_ROOT']);out=Path(os.environ['OUTPUT'])
          receipt=json.loads((root/'office-build.safe.json').read_text());office=receipt['images']['office'];observation=receipt['office']
          assert receipt['source_commit']==os.environ['GITHUB_SHA'] and receipt['native_office_accepted'] is False
          assert re.fullmatch('sha256:[0-9a-f]{64}',office['id']) and re.fullmatch('[0-9a-f]{64}',receipt['build_identity'])
          assert re.fullmatch('goal584-office-office:[0-9a-f]{12}-[0-9a-f]{12}',office['tag'])
          inspect=lambda:subprocess.check_output(['docker','image','inspect',office['tag'],'--format','{{.Id}}'],text=True).strip()
          assert inspect()==office['id']
          source=root/'source';dockerfile=source/'services/officecli-openapi-proof/tests/Dockerfile'
          test=source/'services/officecli-openapi-proof/tests/verify_capability_discovery.py'
          evidence={'schema':1,'office_image_id':office['id'],'dockerfile_sha256':hashlib.sha256(dockerfile.read_bytes()).hexdigest(),'test_sha256':hashlib.sha256(test.read_bytes()).hexdigest(),'stage':'qualification_build','preflight_passed':False,'native_office_accepted':False}
          save=lambda:(out/'qualification.safe.json').write_text(json.dumps(evidence,indent=2)+'\n')
          save()
          tag='goal584-office-qualification:'+receipt['build_identity'];iid=out/'qualification.iid'
          with (out/'qualification-build.log').open('wb') as log:
              subprocess.run(['docker','build','--platform=linux/amd64','--iidfile',str(iid),'-f',str(dockerfile),'--build-arg','OFFICECLI_IMAGE='+office['tag'],'-t',tag,str(source)],stdout=log,stderr=subprocess.STDOUT,check=True)
          assert inspect()==office['id'];image=iid.read_text().strip();assert re.fullmatch('sha256:[0-9a-f]{64}',image)
          evidence.update(qualification_image_id=image,stage='qualification_readback');save()
          readback="import hashlib,importlib.metadata,json,pathlib; from dataclasses import asdict; from officecli_openapi_proof.config import load_settings; from officecli_openapi_proof.officecli import SubprocessOfficeCliExecutor; r=pathlib.Path('/app/officecli_openapi_proof'); lock=pathlib.Path('/app/requirements.lock'); settings=load_settings(); guide=SubprocessOfficeCliExecutor(settings).run('load_skill','word'); versions={n:importlib.metadata.version(n) for n in ('openpyxl','pytest','aiohttp')}; print(json.dumps({'modules':{n:hashlib.sha256((r/n).read_bytes()).hexdigest() for n in "+repr(tuple(observation['modules']))+"},'binary_sha256':hashlib.sha256(pathlib.Path('/usr/local/bin/officecli').read_bytes()).hexdigest(),'lock_sha256':hashlib.sha256(lock.read_bytes()).hexdigest(),'production_lock_matches':all(importlib.metadata.version(n)==v for n,v in (line.split('==') for line in lock.read_text().splitlines() if line and not line.startswith('#'))),'test_dependencies':versions,'office_version':settings.expected_version,'word_guide':asdict(guide)}))"
          common=['docker','run','--rm','--init','--network=none','--read-only','--memory=1g','--pids-limit=256','--tmpfs','/tmp:rw,noexec,nosuid,size=128m','--label','goal584.owner='+os.environ['OWNED']]
          actual=json.loads(subprocess.check_output(common+['--name',os.environ['OWNED']+'-readback','--entrypoint','python',image,'-B','-c',readback],text=True,stderr=subprocess.PIPE))
          guide=actual.pop('word_guide');version=actual.pop('office_version')
          evidence.update(readback=actual);save()
          assert actual['modules']==observation['modules'] and actual['binary_sha256']==observation['binary_sha256'] and actual['production_lock_matches']
          assert actual['lock_sha256']==hashlib.sha256((source/'services/officecli-openapi-proof/requirements.lock').read_bytes()).hexdigest()
          assert version==observation['version']=='1.0.152'
          assert set(guide)=={'command','text','content_sha256','auto_resident_disabled','diagnostics'}
          assert guide['command']==['/usr/local/bin/officecli','load_skill','word'] and guide['auto_resident_disabled'] is True
          assert isinstance(guide['text'],str) and guide['text'] and isinstance(guide['diagnostics'],str)
          content=guide['text'].encode('utf8');assert hashlib.sha256(content).hexdigest()==guide['content_sha256']
          owned_root=root.resolve();assert owned_root.parent==Path(os.environ['RUNNER_TEMP']).resolve() and owned_root.name==os.environ['OWNED']+'-build'
          packet={'schema':1,'source_commit':os.environ['GITHUB_SHA'],'office_image_id':office['id'],
              'qualification_image_id':image,'version':version,'modules':actual['modules'],
              'binary_sha256':actual['binary_sha256'],'output':guide}
          private_guide=json.dumps(packet,ensure_ascii=False,sort_keys=True).encode('utf8')
          guide_path=owned_root/'office-word-guide.private.json'
          fd=os.open(guide_path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
          with os.fdopen(fd,'wb') as handle:handle.write(private_guide)
          assert guide_path.read_bytes()==private_guide
          evidence['word_guide']={'command':guide['command'],'content_sha256':guide['content_sha256'],
              'text_bytes':len(content),'packet_sha256':hashlib.sha256(private_guide).hexdigest(),
              'packet_bytes':len(private_guide),'image_id':image,'binary_sha256':actual['binary_sha256'],
              'modules':actual['modules'],'version':version};save()
          evidence.update(stage='preflight');save()
          target='DiscoveryQualification.test_saved_note_uses_the_same_real_cli_import_and_refuses_a_changed_source'
          with (out/'preflight.log').open('wb') as log:
              result=subprocess.run(common+['--name',os.environ['OWNED']+'-preflight','--mount','type=bind,source='+str(test)+',target=/tests/verify_capability_discovery.py,readonly','--entrypoint','python',image,'-B','/tests/verify_capability_discovery.py',target],stdout=log,stderr=subprocess.STDOUT)
          evidence.update(stage='complete',preflight_passed=result.returncode==0,returncode=result.returncode,test=target);save()
          assert result.returncode==0,'Existing real-CLI preflight failed'
          PY
      - name: Build the reviewed native derivative and prepare the host driver
        timeout-minutes: 10
        run: |
          python3 -m venv "$RUNNER_TEMP/$OWNED-driver"
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -m pip install --disable-pip-version-check \
            -r scripts/goal584-budget-proof/native-patch-requirements.txt \
            -r scripts/goal584-budget-proof/browser-requirements.txt
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -m pip check
          command -v google-chrome
          google-chrome --version
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B scripts/goal584-budget-proof/build_native_floor_image.py \
            --context "$BUILD_ROOT/native-floor" --receipt "$OUTPUT/native-build.safe.json"
      - name: Prepare fresh private Office stand configuration
        timeout-minutes: 6
        run: |
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B - <<'PY'
          import hashlib,json,os,re,secrets,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/goal584-budget-proof')
          from office_fixture import prepare_delegated_office_config,prepare_native_tokenizers
          from verify_admin_calls import literal
          from urllib.request import Request,urlopen
          private=Path(os.environ['RUNNER_TEMP'],os.environ['OWNED']+'-private');private.mkdir(mode=0o700)
          env_file=private/'compose.env';config=private/'config.yaml'
          raw=prepare_delegated_office_config(Path('scripts/goal584-budget-proof/litellm_config.yaml').read_bytes())
          def write(path,data):
              fd=os.open(path,os.O_WRONLY|os.O_CREAT|os.O_EXCL,0o600)
              with os.fdopen(fd,'wb') as handle:handle.write(data)
              assert path.read_bytes()==data
          guide_root=Path(os.environ['BUILD_ROOT']).resolve()
          assert guide_root.parent==Path(os.environ['RUNNER_TEMP']).resolve() and guide_root.name==os.environ['OWNED']+'-build'
          guide_source=guide_root/'office-word-guide.private.json';assert guide_source.is_file() and not guide_source.is_symlink()
          qualification_raw=(Path(os.environ['OUTPUT'])/'qualification.safe.json').read_bytes()
          qualification=json.loads(qualification_raw)
          assert qualification['stage']=='complete' and qualification['preflight_passed'] is True
          guide_bytes=guide_source.read_bytes();guide_sha=qualification['word_guide']['packet_sha256']
          assert hashlib.sha256(guide_bytes).hexdigest()==guide_sha
          write(private/'office-word-guide.private.json',guide_bytes)
          assert hashlib.sha256((private/'office-word-guide.private.json').read_bytes()).hexdigest()==guide_sha
          write(private/'office-qualification.safe.json',qualification_raw)
          tool_url='https://raw.githubusercontent.com/Skyzi000/open-webui-extensions/63310704483845c46b9ddbb65885f70938ac909e/tools/sub_agent.py'
          with urlopen(Request(tool_url,headers={'User-Agent':'goal584-office-proof'}),timeout=30) as response:
              assert response.status==200 and response.geturl()==tool_url
              tool=response.read(4*1024*1024+1)
          expected_tool=literal(Path('scripts/goal584-budget-proof/provision_webui.py'),'DELEGATION_TOOL_SHA256')
          assert 0<len(tool)<=4*1024*1024 and hashlib.sha256(tool).hexdigest()==expected_tool
          write(private/'sub_agent.py',tool)
          write(config,raw)
          cache=private/'native-tokenizers';assets=prepare_native_tokenizers(cache)
          (Path(os.environ['OUTPUT'])/'tokenizers.safe.json').write_text(json.dumps(assets,indent=2)+'\n')
          build=json.loads((Path(os.environ['BUILD_ROOT'])/'office-build.safe.json').read_text())
          native=json.loads((Path(os.environ['OUTPUT'])/'native-build.safe.json').read_text())
          assert build['source_commit']==os.environ['GITHUB_SHA'] and build['native_office_accepted'] is False
          values={'PROOF_PRIVATE_DIR':str(private),'PROOF_CONFIG_FILE':str(config),'PROOF_OFFICE_TOKENIZER_CACHE':str(cache),
            'PROOF_NATIVE_VARIANT':'positive-floor-v1.105.1','PROOF_LITELLM_IMAGE':native['image_ref'],
            'PROOF_OFFICE_WEBUI_IMAGE':build['images']['webui']['id'],'PROOF_OFFICE_IMAGE':build['images']['office']['id']}
          assert all(re.fullmatch('sha256:[0-9a-f]{64}',values[key]) for key in
            ('PROOF_LITELLM_IMAGE','PROOF_OFFICE_WEBUI_IMAGE','PROOF_OFFICE_IMAGE'))
          for key,prefix in (('PROOF_MASTER_KEY','sk-'),('PROOF_DB_PASSWORD',''),
              ('OWUI_BUDGET_GATEWAY_SECRET','gw-'),('WEBUI_SECRET_KEY','')):
              values[key]=prefix+secrets.token_hex(32);print('::add-mask::'+values[key])
          write(env_file,''.join(key+'='+value+'\n' for key,value in values.items()).encode())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as handle:
              handle.write('PROOF_ENV_FILE='+str(env_file)+'\nPROOF_PRIVATE_DIR='+str(private)+'\nPROOF_CONFIG_FILE='+str(config)+'\n')
          # Use the existing built SDK image before starting any stand service.
          # The mandatory flag turns a missing full native component into failure.
          source=Path(os.environ['GITHUB_WORKSPACE']);out=Path(os.environ['OUTPUT'])
          paths=('deploy/openwebui-budgets/unknown_usage_guard.py','deploy/openwebui-budgets/litellm_auth.py',
              'scripts/goal584-budget-proof/test_unknown_usage_guard.py','deploy/openwebui-budgets/tests/test_provenance.py')
          packet={'schema':1,'passed':False,'source_commit':os.environ['GITHUB_SHA'],'native_image_id':native['image_ref'],
              'scope':'Native callback/cleanup/SLP and descriptor components; policy auth fixture, HTTP/DB leaves; genuine admission remains runtime proof',
              'source_sha256':{p:hashlib.sha256((source/p).read_bytes()).hexdigest() for p in paths},'tests':{}}
          save=lambda:(out/'buffered-native-component.safe.json').write_text(json.dumps(packet,indent=2)+'\n')
          save()
          common=['docker','run','--rm','--init','--network','none','--read-only','--memory','1g','--pids-limit','256',
              '--tmpfs','/tmp:rw,noexec,nosuid,size=128m','--name',os.environ['OWNED']+'-preflight',
              '--label','goal584.owner='+os.environ['OWNED'],'--mount','type=bind,source='+str(source)+',target=/repo,readonly',
              '--mount','type=bind,source='+str(cache)+',target=/proof-tokenizers,readonly',
              '-e','CUSTOM_TIKTOKEN_CACHE_DIR=/proof-tokenizers','-e','TIKTOKEN_CACHE_DIR=/proof-tokenizers',
              '-e','LITELLM_LOCAL_MODEL_COST_MAP=True','-e','LITELLM_TELEMETRY=False','-e','DO_NOT_TRACK=1',
              '-e','DOTENV_DISABLED=1','-e','GOAL584_REQUIRE_BUFFERED_NATIVE_COMPONENT=1']
          for label,work,args in (
              ('guard','/repo',['discover','-s','scripts/goal584-budget-proof','-p','test_unknown_usage_guard.py','-v']),
              ('auth','/repo/deploy/openwebui-budgets/tests',['test_provenance.DeclaredBufferedProfileTests',
                  'test_provenance.BoundaryTests.test_gateway_wires_native_route_slot_and_canonical_cache_setter',
                  'test_provenance.ServiceGatewayTests','-v'])):
              with (out/('buffered-native-'+label+'.log')).open('wb') as log:
                  result=subprocess.run(common+['-w',work,'--entrypoint','python',native['image_ref'],'-B','-m','unittest',*args],
                      stdout=log,stderr=subprocess.STDOUT,timeout=75)
              packet['tests'][label]={'returncode':result.returncode};save()
              assert result.returncode==0,'Mandatory native buffered component failed: '+label
          packet['passed']=True;save()
          # Reuse the built WebUI image to check the existing prepared STT path
          # with the real mandatory signing hook, without starting any service.
          audio=source/'services/stage2-stt/tests/verify_native_audio_context_runtime.py'
          intake=source/'services/stage2-stt/openwebui_filters/stage2_audio_context_filter.py'
          budget_sources=('provenance.py','webui_model_binding.py','cost_filter.py')
          audio_packet={'schema':1,'passed':False,'source_commit':os.environ['GITHUB_SHA'],
              'webui_image_id':build['images']['webui']['id'],
              'verifier_sha256':hashlib.sha256(audio.read_bytes()).hexdigest(),
              'filter_sha256':hashlib.sha256(intake.read_bytes()).hexdigest()}
          audio_receipt=out/'audio-budget-component.safe.json'
          audio_receipt.write_text(json.dumps(audio_packet,indent=2)+'\n')
          audio_log=out/'audio-budget-component.log'
          with audio_log.open('wb') as log:
              result=subprocess.run(common+['-e','PYTHONPATH=/app/backend','-w','/repo','--entrypoint','python',
                  build['images']['webui']['id'],'-B','/repo/'+str(audio.relative_to(source)),
                  '--filter','/repo/'+str(intake.relative_to(source)),
                  '--budgets','/repo/deploy/openwebui-budgets'],stdout=log,stderr=subprocess.STDOUT,timeout=120)
          assert result.returncode==0,'Native audio/budget composition failed'
          observed=json.loads(audio_log.read_text().splitlines()[-1])
          assert len(observed['passed'])==7 and len(observed['budget_composition'])==6
          assert observed['cached_forbidden_sidecar_calls']==0 and observed['fresh_transcription_http_fixture_calls']==1
          assert observed['filter_sha256']==audio_packet['filter_sha256']
          assert observed['budget_source_sha256']=={
              name:hashlib.sha256((source/'deploy/openwebui-budgets'/name).read_bytes()).hexdigest() for name in budget_sources}
          audio_packet.update(passed=True,component=observed,
              scope='Native audio preparation/cache/history and actual budget signing; no recognition, provider, ledger or Terminal acceptance')
          audio_receipt.write_text(json.dumps(audio_packet,indent=2)+'\n')
          PY
      - name: Start the isolated backend and enable the existing authentication hook
        timeout-minutes: 7
        run: |
          compose=(docker compose --project-name "$OWNED" --env-file "$PROOF_ENV_FILE" \
            -f compose/goal584.native-budget-proof.yml -f compose/goal584.webui-proof.yml -f compose/goal584.office-proof.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d --wait --wait-timeout 240 postgres redis provider proxy
          "${compose[@]}" exec -T --user "$(id -u):$(id -g)" proxy python -B /proof/prove_gateway_auth.py --phase bootstrap \
            --base-url http://127.0.0.1:4000 --private-state /proof-private/gateway-state.private.json \
            --receipt /proof-private/bootstrap.safe.json > "$OUTPUT/gateway-bootstrap.safe.json"
          python3 -B - <<'PY'
          import os
          from pathlib import Path
          path=Path(os.environ['PROOF_CONFIG_FILE']);raw=path.read_bytes()
          marker=b'general_settings:\n'
          assert raw.count(marker)==1 and b'custom_auth:' not in raw and b'missing_session_id:' not in raw
          value=raw.replace(marker,marker+b'  custom_auth: capture_webui_auth.gateway_auth\n  custom_auth_run_common_checks: true\n  missing_session_id: omit\n',1)
          # Preserve the already-mounted file inode.
          with path.open('r+b') as handle:
              handle.write(value);handle.truncate();handle.flush();os.fsync(handle.fileno())
          assert path.read_bytes()==value
          PY
          "${compose[@]}" restart proxy
          "${compose[@]}" up -d --wait --wait-timeout 240
      - name: Prepare the shared native WebUI and cost Functions
        timeout-minutes: 4
        run: |
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          sys.path.insert(0,'scripts/goal584-budget-proof')
          from prove_cost_browser import CostFixture
          fixture=CostFixture(Path(os.environ['PROOF_ENV_FILE']),Path(os.environ['OUTPUT']))
          fixture.command[2:2]=['--project-name',os.environ['OWNED']]
          fixture.command+=['-f','compose/goal584.office-proof.yml']
          for script,label in (('provision_webui.py','webui'),('provision_cost_display.py','cost')):
              result=subprocess.run(fixture.command+['exec','-T','--user',str(os.getuid())+':'+str(os.getgid()),
                  'proxy','python','-B','/proof/'+script,'--phase','setup',
                  '--private-state','/proof-private/webui-state.private.json',
                  '--receipt','/proof-private/'+label+'-setup.safe.json'],capture_output=True,timeout=120)
              receipt=json.loads(result.stdout)
              assert result.returncode==0 and receipt.get('passed') is True,'Shared native setup failed'
              (fixture.output/(label+'-setup.safe.json')).write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - name: Qualify one Known0 ordinary CC nonstream Send and persisted Details
        if: github.event_name == 'workflow_dispatch' && inputs.acceptance == 'known-zero'
        timeout-minutes: 8
        run: |
          "$RUNNER_TEMP/$OWNED-driver/bin/python" -B - <<'PY'
          import hashlib,json,os,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,'scripts/goal584-budget-proof')
          from playwright.sync_api import sync_playwright
          from prove_cost_browser import CostFixture,run_known_zero
          from prove_gateway_auth import read_private
          # Reserve checkout's bounded minute, this step8, cleanup2 and upload2.
          remaining=54*60-(time.time()-float(os.environ['PROOF_STARTED_EPOCH']))
          assert remaining>=12*60,'Known0 job lacks acceptance/cleanup headroom'
          private=Path(os.environ['PROOF_PRIVATE_DIR']);out=Path(os.environ['OUTPUT'])/'known-zero'
          out.mkdir();fixture=CostFixture(Path(os.environ['PROOF_ENV_FILE']),out)
          fixture.command[2:2]=['--project-name',os.environ['OWNED']]
          fixture.command+=['-f','compose/goal584.office-proof.yml']
          container=subprocess.check_output(fixture.command+['ps','-q','webui'],text=True,timeout=15).strip()
          networks=json.loads(subprocess.check_output(['docker','inspect','--format','{{json .NetworkSettings.Networks}}',container],timeout=15))
          network,=networks.values();base='http://'+network['IPAddress']+':8080'
          owners={
              'proxy':{'/proof/'+name:'scripts/goal584-budget-proof/'+name for name in
                  ('provision_cost_display.py','capture_webui_auth.py','prove_pricing_snapshots.py','usage_guard_fixture.py')},
              'webui':{'/app/backend/employee_budget_cost_readback.py':'deploy/openwebui-budgets/cost_readback.py',
                  '/app/backend/employee_budget_provenance.py':'deploy/openwebui-budgets/provenance.py',
                  '/proof/budgets/cost_action.py':'deploy/openwebui-budgets/cost_action.py'},
              'provider':{'/proof/mock_provider.py':'scripts/goal584-budget-proof/mock_provider.py'}}
          owners['proxy'].update({'/proof/'+target:'deploy/openwebui-budgets/'+source for target,source in
              (('employee_budget_cost_readback.py','cost_readback.py'),('budgets/cost_filter.py','cost_filter.py'),
               ('pricing_snapshot.py','pricing_snapshot.py'),('unknown_usage_guard.py','unknown_usage_guard.py'))})
          sources={'scripts/goal584-budget-proof/prove_cost_browser.py':hashlib.sha256(Path('scripts/goal584-budget-proof/prove_cost_browser.py').read_bytes()).hexdigest()}
          for owner,paths in owners.items():
              mounted={path:hashlib.sha256(Path(source).read_bytes()).hexdigest() for path,source in paths.items()}
              sources.update({source:mounted[path] for path,source in paths.items()})
              code='import hashlib,json,pathlib;print(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in '+repr(tuple(mounted))+'}))'
