name: Native Luna OCR

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/openwebui-functions/luna_pdf_ocr.py
      - deploy/openwebui-functions/tests/test_luna_pdf_ocr.py
      - .github/workflows/luna-ocr.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-luna-ocr:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install component test dependencies
        run: python -m pip install pytest==8.4.2 pypdf==6.7.5 fastapi==0.121.0 httpx==0.28.1 pydantic==2.12.3
      - name: Verify extraction and native boundary contracts
        run: python -m pytest deploy/openwebui-functions/tests/test_luna_pdf_ocr.py -q --tb=short
