name: GOAL584 prepare accepted budget image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goal584-budget-release
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ACCEPTED_SOURCE: 1ebf2b6412aa206976cc9b88ce027cc653993060
      GOAL584_NATIVE_BUILD_OWNER: goal584-release-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Export the accepted source with native LF bytes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1ebf2b6412aa206976cc9b88ce027cc653993060
          persist-credentials: false

      - name: Build with the existing pinned native builder
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SOURCE"
          mkdir "$RUNNER_TEMP/release"
          python -m venv "$RUNNER_TEMP/build-venv"
          "$RUNNER_TEMP/build-venv/bin/python" -m pip install --disable-pip-version-check -r scripts/goal584-budget-proof/native-patch-requirements.txt
          "$RUNNER_TEMP/build-venv/bin/python" scripts/goal584-budget-proof/build_native_floor_image.py \
            --variant stream-usage-v1.105.1 --context "$RUNNER_TEMP/native-context" \
            --receipt "$RUNNER_TEMP/release/native-build.json"
          git rev-parse HEAD > "$RUNNER_TEMP/release/source-commit.txt"

      - name: Preserve the image and verify its archive
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          iid=$(python -c 'import json,os;print(json.load(open(os.environ["RUNNER_TEMP"]+"/release/native-build.json"))["image_id"])')
          test "$(docker image inspect --format '{{.Id}}' "$iid")" = "$iid"
          printf '%s\n' "$iid" > "$RUNNER_TEMP/release/image-id.txt"
          docker save "$iid" | gzip -1 > "$RUNNER_TEMP/release/litellm-goal584.tar.gz"
          gzip -t "$RUNNER_TEMP/release/litellm-goal584.tar.gz"
          cd "$RUNNER_TEMP/release"
          sha256sum native-build*.json source-commit.txt image-id.txt litellm-goal584.tar.gz > SHA256SUMS

      - name: Retain installation image and source receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: goal584-budget-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Close owned builder containers
        if: always()
        shell: bash
        run: |
          mapfile -t owned < <(docker ps -aq --filter "label=goal584.owner=$GOAL584_NATIVE_BUILD_OWNER")
          if ((${#owned[@]})); then docker rm -f "${owned[@]}"; fi
          test -z "$(docker ps -aq --filter "label=goal584.owner=$GOAL584_NATIVE_BUILD_OWNER")"
