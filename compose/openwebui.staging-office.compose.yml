# Merge only with openwebui.staging.compose.yml. Callback resolves in staging.
services:
  officecli-openapi-proof:
    image: ${STAGING_OFFICECLI_IMAGE:?Set the OfficeCLI image qualified against the selected repository revision}
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      OPENWEBUI_BASE_URL: http://openwebui:8080
      OFFICECLI_PROOF_TIMEOUT_SECONDS: "60"
    expose:
      - "8080"
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 0.5
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)).get('status') == 'ok'
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "false"
    networks:
      - isolated
