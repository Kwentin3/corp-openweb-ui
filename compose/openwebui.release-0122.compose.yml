# Isolated candidate. Production routing is a separate, gated overlay.
name: openwebui-0122
services:
  openwebui-0122:
    image: ${RELEASE_WEBUI_IMAGE:?Pin the qualified image ID}
    pull_policy: never
    restart: unless-stopped
    mem_limit: ${RELEASE_WEBUI_MEMORY:-2g}
    memswap_limit: ${RELEASE_WEBUI_MEMORY_SWAP:-3g}
    cpus: ${RELEASE_WEBUI_CPUS:-1}
    pids_limit: 512
    env_file:
      - path: ${RELEASE_WEBUI_ENV_FILE:?Protected candidate WebUI environment}
        format: raw
    environment:
      STAGE2_STT_BASE_URL: http://stage2-stt-0122:8080
      NO_PROXY: ${RELEASE_WEBUI_NO_PROXY:?Preserve proxy exclusions}
      no_proxy: ${RELEASE_WEBUI_NO_PROXY:?Preserve proxy exclusions}
    ports: ["127.0.0.1:18122:8080"]
    volumes: ["data:/app/backend/data"]
    labels:
      traefik.enable: "false"
    networks: [services, existing-web]

  officecli-0122:
    image: sha256:147ff48ecead487136c85c887f160553303b2923e8700e6d79e492f830b0ad85
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      OPENWEBUI_BASE_URL: http://openwebui-0122:8080
      OFFICECLI_PROOF_TIMEOUT_SECONDS: "60"
    expose: ["8080"]
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 0.5
    pids_limit: 256
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)).get('status') == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [services]

  stage2-stt-0122:
    image: sha256:ead2a4df9ea157ba1ee2f402c2363b76851dfc1f4609339d7de25dbb7a0a70b8
    pull_policy: never
    restart: unless-stopped
    mem_limit: ${RELEASE_STT_MEMORY:-512m}
    memswap_limit: ${RELEASE_STT_MEMORY_SWAP:-1g}
    cpus: ${RELEASE_STT_CPUS:-0.5}
    pids_limit: 256
    env_file:
      - path: ${RELEASE_STT_ENV_FILE:?Protected candidate STT environment}
        format: raw
    environment:
      STAGE2_STT_PROMPT_CATALOG_MODE: disabled
      STAGE2_STT_POSTPROCESSING_EXECUTOR_MODE: disabled
      STAGE2_STT_OPENWEBUI_PROMPT_DB_PATH: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_BASE_URL: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_API_KEY: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_MODEL: ""
      STAGE2_STT_ALLOW_STUB_TRANSCRIPT: "false"
      NO_PROXY: ${RELEASE_STT_NO_PROXY:?Preserve proxy exclusions}
      no_proxy: ${RELEASE_STT_NO_PROXY:?Preserve proxy exclusions}
    expose: ["8080"]
    volumes: ["stt_data:/data/stage2-stt"]
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/stage2-api/transcription/capabilities', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks: [services, existing-web]

  open-terminal-0122:
    image: ghcr.io/open-webui/open-terminal@sha256:81a5394b3cd4ae32adb600f2135f09ee124de37f26b0a780e2f5692472c0fc5c
    pull_policy: never
    restart: unless-stopped
    env_file:
      - path: ${RELEASE_TERMINAL_ENV_FILE:?Protected candidate Terminal environment}
        format: raw
    environment:
      OPEN_TERMINAL_MULTI_USER: "true"
    volumes: ["terminal_home:/home"]
    expose: ["8000"]
    mem_limit: ${RELEASE_TERMINAL_MEMORY:-768m}
    memswap_limit: ${RELEASE_TERMINAL_MEMORY_SWAP:-1g}
    cpus: ${RELEASE_TERMINAL_CPUS:-0.5}
    pids_limit: ${RELEASE_TERMINAL_PIDS:-256}
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)).get('status') in (True, 'ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [services]

volumes:
  data:
    name: ${RELEASE_DATA_VOLUME:-openwebui-0122_data}
  stt_data:
    name: ${RELEASE_STT_DATA_VOLUME:-openwebui-0122_stt_data}
  terminal_home:
    name: ${RELEASE_TERMINAL_HOME_VOLUME:-openwebui-0122_terminal_home}

networks:
  services:
  existing-web:
    external: true
    name: openwebui_web
