# SOURCE ONLY: opt-in overlay after the existing release base and Google gateway.
# Target runtime must match the accepted image/source and protected config.
# Reuse native DB/Redis configuration; this file creates no service or data owner.
x-employee-budget-bind: &employee-budget-bind
  type: bind
  read_only: true
  bind: {create_host_path: false}

services:
  google-gateway-0122:
    image: ${EMPLOYEE_BUDGET_LITELLM_IMAGE:?Pin the reviewed budget gateway image}
    # The native CLI adds its cwd to sys.path for adjacent callback peer imports.
    working_dir: /app
    environment:
      OWUI_BUDGET_REQUIRE_PROVENANCE: "true"
    # Compose appends env_file entries; retain the release gateway environment.
    env_file:
      - path: ${EMPLOYEE_BUDGET_ENV_FILE:?Protected budget gateway environment}
        format: raw
    volumes:
      # Compose replaces the inherited bind having this same container target.
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_CONFIG_FILE:?Prepared budget gateway config}
        target: /app/config.yaml
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/litellm_auth.py
        target: /app/litellm_auth.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/budget_errors.py
        target: /app/budget_errors.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/pricing_snapshot.py
        target: /app/pricing_snapshot.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/unknown_usage_guard.py
        target: /app/unknown_usage_guard.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/provenance.py
        target: /app/provenance.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/assignment.py
        target: /app/employee_budget_assignment.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/admin_client.py
        target: /app/employee_budget_admin_client.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/admin_contract.py
        target: /app/employee_budget_admin_contract.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/budget_runtime.py
        target: /app/budget_runtime.py

  openwebui-0122:
    # Native Compose merge retains the existing /app/backend/data volume.
    volumes:
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/provenance.py
        target: /app/backend/employee_budget_provenance.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/cost_readback.py
        target: /app/backend/employee_budget_cost_readback.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/assignment.py
        target: /app/backend/employee_budget_assignment.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/admin_contract.py
        target: /app/backend/employee_budget_admin_contract.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/admin_client.py
        target: /app/backend/employee_budget_admin_client.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/admin_policy.py
        target: /app/backend/employee_budget_admin_policy.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/admin_ui.py
        target: /app/backend/employee_budget_admin_ui.py
      - <<: *employee-budget-bind
        source: ${EMPLOYEE_BUDGET_MODULES_DIR:?Reviewed budget modules directory}/webui_model_binding.py
        target: /app/backend/employee_budget_webui_model_binding.py
