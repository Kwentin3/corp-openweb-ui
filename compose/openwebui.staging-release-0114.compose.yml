# Separate release candidate; never merge with the old production/staging Compose.
# Resolve/inspect first; boot only on a private working data set with copied
# providers/tasks suspended. Production routing requires separate release approval.
# Image IDs must already exist locally (or be transported with docker save/load).
name: openwebui-0114

services:
  openwebui-0114:
    image: sha256:c4ba3bda7e228f99a246f1d823dfe2a8830dbd8fad6966d2e1862350fb8be423
    pull_policy: never
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 3g
    memswap_limit: 4g
    pids_limit: 512
    env_file:
      - path: ${RELEASE_WEBUI_ENV_FILE:?Set the protected preserved WebUI environment file}
        format: raw
    environment:
      CHAT_RESPONSE_MAX_TOOL_CALL_ITERATIONS: "8"
      STAGE2_STT_BASE_URL: http://stage2-stt-0114:8080
      NO_PROXY: ${RELEASE_WEBUI_NO_PROXY:?Preserve existing WebUI exclusions and append new service names}
      no_proxy: ${RELEASE_WEBUI_NO_PROXY:?Preserve existing WebUI exclusions and append new service names}
    expose: ["8080"]
    volumes:
      - data:/app/backend/data
    labels:
      traefik.enable: "false"
    networks:
      - services
      - existing-web

  stage2-stt-0114:
    image: sha256:ead2a4df9ea157ba1ee2f402c2363b76851dfc1f4609339d7de25dbb7a0a70b8
    pull_policy: never
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 0.5
    pids_limit: 256
    env_file:
      - path: ${RELEASE_STT_ENV_FILE:?Set the protected preserved STT environment file}
        format: raw
    environment:
      STAGE2_STT_PROMPT_CATALOG_MODE: disabled
      STAGE2_STT_POSTPROCESSING_EXECUTOR_MODE: disabled
      STAGE2_STT_OPENWEBUI_PROMPT_DB_PATH: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_BASE_URL: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_API_KEY: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_MODEL: ""
      STAGE2_STT_ALLOW_STUB_TRANSCRIPT: "false"
      NO_PROXY: ${RELEASE_STT_NO_PROXY:?Preserve existing STT exclusions and append new service names}
      no_proxy: ${RELEASE_STT_NO_PROXY:?Preserve existing STT exclusions and append new service names}
    expose: ["8080"]
    volumes:
      - stt_data:/data/stage2-stt
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/stage2-api/transcription/capabilities', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - services
      - existing-web

  officecli-0114:
    image: sha256:ae3b56ad0634dabd0da9e431282db28aa024f835dad500c91401af134bff0c67
    pull_policy: never
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    environment:
      OPENWEBUI_BASE_URL: http://openwebui-0114:8080
      OFFICECLI_PROOF_TIMEOUT_SECONDS: "60"
    expose: ["8080"]
    mem_limit: 1g
    memswap_limit: 2g
    cpus: 0.5
    pids_limit: 256
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)).get('status') == 'ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - services

  open-terminal-0114:
    image: ghcr.io/open-webui/open-terminal@sha256:81a5394b3cd4ae32adb600f2135f09ee124de37f26b0a780e2f5692472c0fc5c
    pull_policy: never
    restart: unless-stopped
    env_file:
      - path: ${RELEASE_TERMINAL_ENV_FILE:?Set the protected preserved Terminal environment file}
        format: raw
    environment:
      OPEN_TERMINAL_MULTI_USER: "true"
    volumes:
      - terminal_home:/home
    expose: ["8000"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)).get('status') in (True, 'ok')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - services

volumes:
  data:
  stt_data:
  terminal_home:

networks:
  services:
  existing-web:
    external: true
    name: openwebui_web
