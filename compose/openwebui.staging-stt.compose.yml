# Media preparation component only. No provider credentials or production data.
services:
  openwebui:
    environment:
      STAGE2_STT_INTERNAL_API_KEY: ${STAGING_STT_INTERNAL_API_KEY:?Set a separate staging STT key}
      STAGE2_STT_BASE_URL: ${STAGING_STT_BASE_URL:-http://stage2-stt:8080}
      NO_PROXY: localhost,127.0.0.1,::1,openwebui,open-terminal-office,officecli-openapi-proof,searxng,searxng-valkey,stage2-stt
      no_proxy: localhost,127.0.0.1,::1,openwebui,open-terminal-office,officecli-openapi-proof,searxng,searxng-valkey,stage2-stt

  stage2-stt:
    image: ${STAGING_STT_IMAGE:?Set the qualified immutable STT image ID or digest}
    restart: "no"
    mem_limit: 768m
    memswap_limit: 1g
    cpus: 0.5
    pids_limit: 256
    environment:
      STAGE2_STT_PROVIDER: lemonfox
      STAGE2_STT_PROVIDER_ADAPTER: lemonfox
      STAGE2_LEMONFOX_API_KEY: ""
      STAGE2_LEMONFOX_LANGUAGE: ru
      STAGE2_LEMONFOX_ENABLE_SPEAKER_LABELS: "true"
      STAGE2_LEMONFOX_ENABLE_TIMESTAMPS: "true"
      STAGE2_STT_INTERNAL_API_KEY: ${STAGING_STT_INTERNAL_API_KEY:?Set a separate staging STT key}
      STAGE2_STT_INPUT_ACCEPT_MODE: broad_ffmpeg_probe
      STAGE2_STT_REQUIRE_AUDIO_STREAM: "true"
      STAGE2_STT_OUTPUT_PROFILE: mp3_high_compat
      STAGE2_STT_FALLBACK_OUTPUT_PROFILE: mp3_high_compat
      STAGE2_STT_STORAGE_MODE: none
      STAGE2_STT_STORE_SOURCE_MEDIA: "false"
      STAGE2_STT_STORE_PREPARED_AUDIO: "false"
      STAGE2_STT_ARTIFACT_STORE_MODE: sqlite
      STAGE2_STT_ARTIFACT_STORE_PATH: /data/stage2-stt/artifacts.sqlite3
      STAGE2_STT_ARTIFACT_PAYLOAD_DIR: /data/stage2-stt/payloads
      STAGE2_STT_PROMPT_CATALOG_MODE: disabled
      STAGE2_STT_POSTPROCESSING_EXECUTOR_MODE: disabled
      STAGE2_STT_POSTPROCESSING_OPENAI_BASE_URL: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_API_KEY: ""
      STAGE2_STT_POSTPROCESSING_OPENAI_MODEL: ""
      STAGE2_STT_ALLOW_STUB_TRANSCRIPT: "false"
      http_proxy: ""
      https_proxy: ""
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,::1,stage2-stt,openwebui
      no_proxy: localhost,127.0.0.1,::1,stage2-stt,openwebui
    expose:
      - "8080"
    volumes:
      - stt_data:/data/stage2-stt
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/stage2-api/transcription/capabilities', timeout=5).read()"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - isolated

volumes:
  stt_data:
