# Free built-in multi-user Open Terminal is suitable only when every OpenWebUI
# user is trusted at the same level. It separates home directories, but shares
# the container kernel, process list, network and resource pool. Do not activate
# this service for mutually untrusted users; use licensed Terminals with a
# per-user backend instead.
services:
  open-terminal-office:
    image: ghcr.io/open-webui/open-terminal@sha256:81a5394b3cd4ae32adb600f2135f09ee124de37f26b0a780e2f5692472c0fc5c
    restart: unless-stopped
    environment:
      OPEN_TERMINAL_API_KEY: ${OPEN_TERMINAL_API_KEY:?set OPEN_TERMINAL_API_KEY}
      OPEN_TERMINAL_MULTI_USER: "true"
    volumes:
      - open_terminal_office_home:/home
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          assert json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)).get('status') in (True, 'ok')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    pids_limit: 512
    labels:
      - traefik.enable=false
    networks:
      - openwebui_web

volumes:
  open_terminal_office_home:

networks:
  openwebui_web:
    external: true
    name: openwebui_web
