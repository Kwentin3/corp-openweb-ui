# Disposable synthetic backend only. Never combine with production Compose files.
# Required credentials must be freshly generated, with a URL-safe DB password.
# Official image indexes resolved from registry-1.docker.io on 2026-11-02.
# PostgreSQL 16/pgvector image and extension verified from the official registry
# on 2026-11-03; vector storage uses a separate empty database in this fixture.
name: goal584-native-budget-proof

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.7-pg16-bookworm@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    environment:
      POSTGRES_DB: goal584
      POSTGRES_USER: goal584
      POSTGRES_PASSWORD: ${PROOF_DB_PASSWORD:?Generate a fresh URL-safe synthetic DB password}
    volumes:
      - proof_postgres:/var/lib/postgresql/data
      - type: bind
        source: ../scripts/goal584-budget-proof/init_vector_database.sql
        target: /docker-entrypoint-initdb.d/10-goal584-vectors.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U goal584 -d goal584"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [proof]

  redis:
    image: docker.io/library/redis:7-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [proof]

  provider:
    image: &litellm_image ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    entrypoint: ["python", "-B", "/proof/mock_provider.py"]
    read_only: true
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - type: bind
        source: ../scripts/goal584-budget-proof/mock_provider.py
        target: /proof/mock_provider.py
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).read()"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [proof]

  proxy:
    image: ${PROOF_LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802}
    working_dir: ${PROOF_PROXY_WORKDIR:-/app}
    mem_limit: 2g
    memswap_limit: 3g
    cpus: 1.5
    pids_limit: 512
    # Keep the image's native entrypoint/CLI migration path on the fresh DB.
    command: ["--config", "/proof/config.yaml", "--host", "0.0.0.0", "--port", "4000", "--num_workers", "1", "--telemetry", "false"]
    env_file:
      - path: ${PROOF_PROXY_ENV_FILE:-/dev/null}
        required: false
        format: raw
    environment:
      PROOF_MASTER_KEY: ${PROOF_MASTER_KEY:?Generate a fresh synthetic sk-prefixed master key}
      OWUI_BUDGET_GATEWAY_SECRET: ${OWUI_BUDGET_GATEWAY_SECRET:?Generate a separate synthetic gateway secret}
      DATABASE_URL: postgresql://goal584:${PROOF_DB_PASSWORD:?Generate a fresh URL-safe synthetic DB password}@postgres:5432/goal584
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      STORE_PROMPTS_IN_SPEND_LOGS: "false"
      NO_PROXY: localhost,127.0.0.1,postgres,redis,provider
      PROOF_NATIVE_VARIANT: ${PROOF_NATIVE_VARIANT:-stock}
      PROOF_LITELLM_IMAGE: ${PROOF_LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.105.1@sha256:b7b9e2c306343721802253d0dd9436b9634a2eb4e14da7c7cf06c5c7b7530802}
    volumes:
      - type: bind
        source: ../deploy/litellm-patches/positive-floor-v1.105.1/native_floor_identity.py
        target: /proof/native_floor_identity.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../deploy/litellm-patches/positive-floor-v1.105.1/manifest.json
        target: /proof/manifest.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROOF_CONFIG_FILE:?Prepare the private stock config copy for this run}
        target: /proof/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../scripts/goal584-budget-proof/prove_native_budgets.py
        target: /proof/prove_native_budgets.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../deploy/openwebui-budgets/litellm_auth.py
        target: /proof/litellm_auth.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../deploy/openwebui-budgets/budget_errors.py
        target: /proof/budget_errors.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../deploy/openwebui-budgets/pricing_snapshot.py
        target: /proof/pricing_snapshot.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../scripts/goal584-budget-proof/prove_pricing_snapshots.py
        target: /proof/prove_pricing_snapshots.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../deploy/openwebui-budgets/assignment.py
        target: /proof/employee_budget_assignment.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../deploy/openwebui-budgets/budget_runtime.py
        target: /proof/budget_runtime.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../deploy/openwebui-budgets/unknown_usage_guard.py
        target: /proof/unknown_usage_guard.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../deploy/openwebui-budgets/provenance.py
        target: /proof/provenance.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../deploy/openwebui-budgets/provenance.py
        target: /proof/employee_budget_provenance.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../deploy/openwebui-budgets/admin_client.py
        target: /proof/employee_budget_admin_client.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../deploy/openwebui-budgets/admin_contract.py
        target: /proof/employee_budget_admin_contract.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../deploy/openwebui-budgets/cost_readback.py
        target: /proof/employee_budget_cost_readback.py
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../scripts/goal584-budget-proof/prove_gateway_auth.py
        target: /proof/prove_gateway_auth.py
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PROOF_PRIVATE_DIR:?Prepare a private state directory for this run}
        target: /proof-private
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      provider:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3).read()"]
      interval: 3s
      timeout: 5s
      retries: 50
      start_period: 30s
    networks: [proof]

volumes:
  # Project-scoped disposable data. The workflow must run down --volumes.
  proof_postgres:

networks:
  proof:
    internal: true
